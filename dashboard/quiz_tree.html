<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شجرة المهارات - Skill Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #1e1b4b; --surface: #312e81; --primary: #8b5cf6; --text: #f8fafc; --text-2: #c7d2fe; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }
        .header { padding: 20px; text-align: center; background: rgba(30,27,75,0.9); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--surface); }
        .tree-container { padding: 50px 20px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
        
        .tier { display: flex; gap: 30px; justify-content: center; position: relative; }
        /* Branch lines simulated with pseudo elements */
        .tier::after { content: ''; position: absolute; bottom: -25px; left: 50%; width: 2px; height: 25px; background: var(--primary); }
        .tier:last-child::after { display: none; }
        
        .skill-node { width: 90px; height: 90px; background: var(--surface); border: 3px solid #4f46e5; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; }
        .skill-node.locked { filter: grayscale(100%); opacity: 0.6; border-color: #64748b; }
        .skill-node.max { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245,158,11,0.5); }
        .skill-node i { font-size: 1.8rem; margin-bottom: 5px; }
        .skill-node.max i { color: #f59e0b; }
        .skill-name { font-size: 0.75rem; font-weight: bold; text-align: center; }
        
        .skill-level { position: absolute; bottom: -10px; background: var(--bg); border: 2px solid var(--primary); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
        .skill-node.max .skill-level { border-color: #f59e0b; color: #f59e0b; }
    </style>
</head>
<body>
    <div class="header"><h2>شجرة الإنجاز (Skill Tree)</h2><p style="color:var(--text-2)">افتح قدرات جديدة في السيرة</p></div>
    <div class="tree-container">
        
        <!-- Tier 1 -->
        <div class="tier">
            <div class="skill-node max">
                <i class="fa-solid fa-book-open"></i>
                <div class="skill-name">أساسيات السيرة</div>
                <div class="skill-level">Max</div>
            </div>
        </div>
        
        <!-- Tier 2 -->
        <div class="tier">
            <div class="skill-node max">
                <i class="fa-solid fa-kaaba"></i>
                <div class="skill-name">العهد المكي</div>
                <div class="skill-level">3/3</div>
            </div>
            <div class="skill-node">
                <i class="fa-solid fa-users"></i>
                <div class="skill-name">شخصيات الصحابة</div>
                <div class="skill-level">1/3</div>
            </div>
        </div>
        
        <!-- Tier 3 -->
        <div class="tier">
            <div class="skill-node locked">
                <i class="fa-solid fa-route"></i>
                <div class="skill-name">الهجرة النبوية</div>
                <div class="skill-level">0/5</div>
            </div>
            <div class="skill-node locked">
                <i class="fa-solid fa-swords"></i>
                <div class="skill-name">الغزوات</div>
                <div class="skill-level">0/5</div>
            </div>
            <div class="skill-node locked">
                <i class="fa-solid fa-mosque"></i>
                <div class="skill-name">العهد المدني</div>
                <div class="skill-level">0/5</div>
            </div>
        </div>

    </div>
</body>
</html>
