<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lier mon Compte</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --primary: #ffffff;
            --text-1: #ffffff;
            --text-2: #888888;
            --danger: #ff453a;
            --accent: #0a84ff;
        }
        body {
            background-color: var(--bg);
            color: var(--text-1);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* Video Container */
        .video-container {
            width: 100%;
            max-width: 400px;
            height: 250px;
            background: var(--surface);
            overflow: hidden;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .container {
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
        }
        p {
            margin: 0;
            color: var(--text-2);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            background: var(--surface);
            border: 1px solid #333;
            color: var(--text-1);
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button.btn-primary {
            background: var(--primary);
            color: var(--bg);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        button.btn-primary:active {
            transform: scale(0.97);
        }
        
        /* SOS Area */
        .sos-btn {
            display: none;
            background: none;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
        }
        .sos-area {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #1a0505;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #330000;
            margin-top: 10px;
        }
        .sos-area textarea {
            background: #000;
            border: 1px solid var(--danger);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            min-height: 80px;
            resize: none;
        }
        .sos-area button {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Outfit', sans-serif;
        }
        
        #error-msg {
            color: var(--danger);
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }
        #success-msg {
            color: #34c759;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Remplacer le lien par ta vraie vidéo MP4 -->
        <video autoplay loop muted playsinline>
            <source src="https://cdn.pixabay.com/video/2020/05/11/38600-418658055_large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="container" id="main-form">
        <h1>Vérification</h1>
        <p>Entrez vos informations pour obtenir votre lien de groupe Telegram.</p>
        
        <div id="error-msg"></div>

        <div class="input-group">
            <label>Matricule (Student ID)</label>
            <input type="text" id="student_id" placeholder="Ex: 1024" required>
        </div>
        
        <div class="input-group">
            <label>Adresse Email</label>
            <input type="email" id="email" placeholder="email@exemple.com" required>
        </div>
        
        <div class="input-group">
            <label>Date de Naissance</label>
            <input type="date" id="dob" required>
        </div>

        <button class="btn-primary" onclick="linkAccount()" id="btn-submit">Vérifier mon profil</button>
        
        <!-- SOS BUTTON -->
        <button class="sos-btn" id="btn-sos-trigger" onclick="showSOS()">🆘 Je suis bloqué</button>
        
        <div class="sos-area" id="sos-box">
            <p style="color:var(--danger); font-size:0.85rem; text-align:left;">Expliquez votre problème, un administrateur vous répondra sur Telegram.</p>
            <textarea id="sos_msg" placeholder="Ex: Je n'arrive pas à me connecter, j'ai oublié l'email utilisé..."></textarea>
            <button onclick="sendSOS()">Envoyer ma demande</button>
        </div>
    </div>
    
    <div class="container" id="success-msg">
        <div>✅ Accès Autorisé</div>
        <p style="color:var(--text-1);">Votre compte a été lié avec succès.</p>
        <button class="btn-primary" id="btn-join-group" onclick="joinGroup()">Rejoindre mon groupe</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        
        let failCount = 0;
        let finalGroupLink = "";

        async function linkAccount() {
            const email = document.getElementById('email').value;
            const dob = document.getElementById('dob').value;
            const student_id = document.getElementById('student_id').value;
            
            if(!email || !dob || !student_id) {
                showError("Veuillez remplir tous les champs.");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.textContent = "Vérification...";
            btn.disabled = true;
            
            const initData = window.Telegram.WebApp.initData;

            try {
                const response = await fetch('/api/link_account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, dob, student_id, initData })
                });
                const data = await response.json();
                
                if(data.success) {
                    if (window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    }
                    document.getElementById('main-form').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'flex';
                    finalGroupLink = data.group_link;
                    if(!finalGroupLink) {
                        document.getElementById('btn-join-group').textContent = "Lien non configuré";
                        document.getElementById('btn-join-group').disabled = true;
                    }
                } else {
                    failCount++;
                    showError(data.error || "Erreur inconnue");
                    if(failCount >= 2) {
                        document.getElementById('btn-sos-trigger').style.display = 'block';
                    }
                    if (window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                    }
                }
            } catch(e) {
                showError("Erreur de connexion.");
            }
            btn.textContent = "Vérifier mon profil";
            btn.disabled = false;
        }
        
        function joinGroup() {
            if(finalGroupLink) {
                window.Telegram.WebApp.openTelegramLink(finalGroupLink);
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
        }
        
        function showSOS() {
            document.getElementById('btn-sos-trigger').style.display = 'none';
            document.getElementById('sos-box').style.display = 'flex';
        }
        
        async function sendSOS() {
            const email = document.getElementById('email').value;
            const msg = document.getElementById('sos_msg').value;
            
            if(!msg) return;
            
            try {
                const response = await fetch('/api/gateway/sos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, message: msg })
                });
                document.getElementById('sos-box').innerHTML = "<p style='color:#34c759;'>Demande envoyée. Un administrateur vous répondra sous peu.</p>";
            } catch(e) {
                alert("Erreur lors de l'envoi.");
            }
        }
    </script>
</body>
</html>
