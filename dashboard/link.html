<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ربط الحساب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #1e0033 0%, #000b29 100%);
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #ffffff;
            --text-1: #ffffff;
            --text-2: #b3a5c7;
            --danger: #ff453a;
            --accent: #8736ff;
        }
        body {
            background: var(--bg);
            color: var(--text-1);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            display: block; /* Removed flex to fix telegram webapp scroll space issue */
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        .video-container {
            width: 100%;
            height: 180px; /* Reduced height to save space */
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .video-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to top, rgba(16,3,32,1) 0%, transparent 100%);
        }
        
        .container {
            padding: 20px 20px 40px 20px; /* Extra padding at bottom for scroll room */
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
        }
        p {
            margin: 0;
            color: var(--text-2);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-2);
        }
        input, select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-1);
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,0.5);
        }
        .input-error {
            border-color: var(--danger) !important;
            background: rgba(255, 69, 58, 0.1) !important;
        }
        .inline-error-text {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: -4px;
            display: none;
        }
        
        .dob-group {
            display: flex;
            gap: 10px;
        }
        .dob-group select {
            flex: 1;
            padding: 14px 10px;
        }

        button.btn-primary {
            background: linear-gradient(90deg, var(--accent) 0%, #5721d9 100%);
            color: var(--text-1);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(135, 54, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button.btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(135, 54, 255, 0.2);
        }
        
        /* SOS Area */
        .sos-btn {
            display: none;
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            margin-top: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .sos-area {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 69, 58, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 69, 58, 0.3);
            margin-top: 10px;
        }
        .sos-area textarea {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--danger);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            min-height: 80px;
            resize: none;
        }
        .sos-area button {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Tajawal', sans-serif;
        }
        
        #global-error {
            background: rgba(255, 69, 58, 0.1);
            border: 1px solid rgba(255, 69, 58, 0.4);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            display: none;
            margin-bottom: 5px;
        }
        
        #success-msg {
            color: #34c759;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            display: none;
            flex-direction: column;
            gap: 15px;
            background: rgba(52, 199, 89, 0.05);
            border: 1px solid rgba(52, 199, 89, 0.3);
            border-radius: 15px;
            padding: 30px 20px;
        }
        .icon-success {
            font-size: 4rem;
            margin-bottom: -10px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Remplacer le lien par ta vraie vidéo MP4 -->
        <video autoplay loop muted playsinline>
            <source src="https://cdn.pixabay.com/video/2020/05/11/38600-418658055_large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="container" id="main-form">
        <h1>أهلاً بك في الأكاديمية! 🎉</h1>
        <p>أنت على بُعد خطوة واحدة فقط للانضمام إلى مجموعات الدراسة الرسمية. يرجى إدخال بياناتك.</p>
        
        <div id="global-error"></div>

        <div class="input-group">
            <label>رقم الطالب</label>
            <input type="number" id="student_id" placeholder="مثال: 000123" required>
            <div class="inline-error-text" id="err-student_id"></div>
        </div>
        
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="البريد الإلكتروني المستخدم في التسجيل" required>
            <div class="inline-error-text" id="err-email"></div>
        </div>
        
        <div class="input-group">
            <label>تاريخ الميلاد</label>
            <div class="dob-group" id="dob-group-container">
                <select id="dob_day"><option value="">اليوم</option></select>
                <select id="dob_month"><option value="">الشهر</option></select>
                <select id="dob_year"><option value="">السنة</option></select>
            </div>
            <div class="inline-error-text" id="err-dob"></div>
        </div>

        <button class="btn-primary" onclick="linkAccount()" id="btn-submit">دخول</button>
        
        <!-- SOS BUTTON -->
        <button class="sos-btn" id="btn-sos-trigger" onclick="showSOS()">🆘 أواجه مشكلة</button>
        
        <div class="sos-area" id="sos-box">
            <p style="color:#ff6b6b; font-size:0.9rem; text-align:right;">اشرح مشكلتك هنا وسيقوم أحد المشرفين بالرد عليك عبر تيليجرام.</p>
            <textarea id="sos_msg" placeholder="مثال: لا أستطيع الدخول، نسيت البريد الإلكتروني..."></textarea>
            <button onclick="sendSOS()">إرسال طلب المساعدة</button>
        </div>
    </div>
    
    <div class="container" id="success-msg">
        <div class="icon-success">✅</div>
        <div style="font-size: 1.5rem;">تم التحقق بنجاح</div>
        <p style="color:var(--text-1);">تم ربط حسابك بنجاح، يمكنك الآن الانضمام إلى مجموعتك.</p>
        
        <button class="btn-primary" id="btn-join-group" onclick="joinGroup()">الانضمام إلى مجموعتي</button>
        
        <button class="btn-primary" style="background: linear-gradient(90deg, #0a84ff 0%, #0056b3 100%); margin-top:5px; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);" onclick="window.Telegram.WebApp.openTelegramLink('https://t.me/addlist/jcgwXUtzsfBhMGI8')">📁 إضافة مجلد الأكاديمية</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        
        // Populate DOB dropdowns
        const dSelect = document.getElementById('dob_day');
        for(let i=1; i<=31; i++) {
            let val = i < 10 ? '0'+i : ''+i;
            dSelect.innerHTML += `<option value="${val}">${val}</option>`;
        }
        
        const mSelect = document.getElementById('dob_month');
        for(let i=1; i<=12; i++) {
            let val = i < 10 ? '0'+i : ''+i;
            mSelect.innerHTML += `<option value="${val}">${val}</option>`;
        }
        
        const ySelect = document.getElementById('dob_year');
        const currYear = new Date().getFullYear();
        for(let i=currYear-10; i>=currYear-80; i--) {
            ySelect.innerHTML += `<option value="${i}">${i}</option>`;
        }
        
        let failCount = 0;
        let finalGroupLink = "";

        function clearErrors() {
            document.getElementById('global-error').style.display = 'none';
            const errorTexts = document.querySelectorAll('.inline-error-text');
            errorTexts.forEach(el => el.style.display = 'none');
            const inputs = document.querySelectorAll('input, .dob-group');
            inputs.forEach(el => el.classList.remove('input-error'));
        }

        function showFieldError(fieldId, msg) {
            const field = document.getElementById(fieldId);
            const errDiv = document.getElementById('err-' + fieldId);
            
            if (fieldId === 'dob') {
                document.getElementById('dob-group-container').classList.add('input-error');
            } else if (field) {
                field.classList.add('input-error');
            }
            
            if (errDiv) {
                errDiv.textContent = msg;
                errDiv.style.display = 'block';
            } else {
                // Fallback
                document.getElementById('global-error').textContent = msg;
                document.getElementById('global-error').style.display = 'block';
            }
        }

        async function linkAccount() {
            clearErrors();
            const email = document.getElementById('email').value.trim();
            const student_id = document.getElementById('student_id').value.trim();
            const d = document.getElementById('dob_day').value;
            const m = document.getElementById('dob_month').value;
            const y = document.getElementById('dob_year').value;
            
            if(!email || !student_id || !d || !m || !y) {
                document.getElementById('global-error').textContent = "يرجى ملء جميع الحقول";
                document.getElementById('global-error').style.display = 'block';
                return;
            }
            
            // Force 6 digits
            if(student_id.length !== 6) {
                showFieldError('student_id', "يجب أن يتكون رقم الطالب من 6 أرقام");
                return;
            }
            
            const dob = `${d}/${m}/${y}`; // Formatting for backend (DD/MM/YYYY)

            const btn = document.getElementById('btn-submit');
            btn.textContent = "جاري التحقق...";
            btn.disabled = true;
            
            const initData = window.Telegram.WebApp.initData;

            try {
                const response = await fetch('/api/link_account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, dob, student_id, initData })
                });
                const data = await response.json();
                
                if(data.success) {
                    if (window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    }
                    document.getElementById('main-form').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'flex';
                    finalGroupLink = data.group_link;
                    if(!finalGroupLink) {
                        document.getElementById('btn-join-group').textContent = "الرابط غير متوفر";
                        document.getElementById('btn-join-group').disabled = true;
                    }
                } else {
                    failCount++;
                    
                    if (data.error_field) {
                        showFieldError(data.error_field, data.error);
                    } else {
                        document.getElementById('global-error').textContent = data.error || "حدث خطأ غير معروف";
                        document.getElementById('global-error').style.display = 'block';
                    }

                    if(failCount >= 1) {
                        document.getElementById('btn-sos-trigger').style.display = 'block';
                    }
                    if (window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                    }
                }
            } catch(e) {
                document.getElementById('global-error').textContent = "خطأ في الاتصال";
                document.getElementById('global-error').style.display = 'block';
            }
            btn.textContent = "دخول";
            btn.disabled = false;
        }
        
        function joinGroup() {
            if(finalGroupLink) {
                window.Telegram.WebApp.openTelegramLink(finalGroupLink);
            }
        }
        
        function showSOS() {
            document.getElementById('btn-sos-trigger').style.display = 'none';
            const sosBox = document.getElementById('sos-box');
            sosBox.style.display = 'flex';
            // Scroll to SOS box
            setTimeout(() => {
                sosBox.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        }
        
        async function sendSOS() {
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('sos_msg').value.trim();
            const student_id = document.getElementById('student_id').value.trim();
            const d = document.getElementById('dob_day').value;
            const m = document.getElementById('dob_month').value;
            const y = document.getElementById('dob_year').value;
            const dob = (d && m && y) ? `${d}/${m}/${y}` : '';
            
            if(!msg) return;
            
            try {
                let tid = null;
                if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    tid = window.Telegram.WebApp.initDataUnsafe.user.id;
                }
                const response = await fetch('/api/gateway/sos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, message: msg, telegram_id: tid, dob: dob, student_id: student_id })
                });
                document.getElementById('sos-box').innerHTML = "<p style='color:#34c759; font-weight:bold;'>تم إرسال طلبك بنجاح. سيتم الرد عليك قريباً.</p>";
            } catch(e) {
                alert("Erreur lors de l'envoi.");
            }
        }
    </script>
</body>
</html>
