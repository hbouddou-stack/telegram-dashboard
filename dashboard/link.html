<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lier mon compte</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #818cf8;
            --text-1: #f8fafc;
            --text-2: #cbd5e1;
            --border: #334155;
        }
        body {
            background-color: var(--bg);
            color: var(--text-1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p {
            color: var(--text-2);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-1);
            outline: none;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            font-weight: 600;
            display: none;
        }
        #success-view {
            display: none;
        }
        .icon-large {
            font-size: 3rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="form-view">
        <h1>Lier mon compte</h1>
        <p>Associe ton compte Telegram à l'Académie pour accéder aux groupes privés.</p>
        
        <div class="form-group">
            <label>Email d'inscription</label>
            <input type="email" id="email" placeholder="h.bouddou@gmail.com">
        </div>
        <div class="form-group">
            <label>Date de naissance</label>
            <input type="text" id="dob" placeholder="10/10/2000">
        </div>
        
        <button onclick="linkAccount()">🔗 Lier mon compte</button>
        <div class="error" id="error-msg"></div>
    </div>

    <div class="container" id="success-view">
        <div class="icon-large">✅</div>
        <h1 style="color: #10b981;">Compte Lié !</h1>
        <p>Bienvenue <strong id="first-name"></strong> !<br>Tu peux maintenant fermer cette page et rejoindre les groupes.</p>
        <button onclick="window.Telegram.WebApp.close()" style="background: var(--surface); color: var(--primary); border: 2px solid var(--primary); box-shadow: none;">Retour au bot</button>
    </div>

    <script>
        // Init Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        async function linkAccount() {
            const email = document.getElementById('email').value.trim();
            const dob = document.getElementById('dob').value.trim();
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.style.display = 'none';
            
            if (!email || !dob) {
                errorDiv.textContent = 'Veuillez remplir tous les champs.';
                errorDiv.style.display = 'block';
                return;
            }
            
            let telegram_id = null;
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                telegram_id = window.Telegram.WebApp.initDataUnsafe.user.id;
            }
            
            if (!telegram_id) {
                errorDiv.textContent = 'Erreur : Impossible de récupérer votre ID Telegram. Veuillez ouvrir cette page depuis l\'application Telegram.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/link_account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, dob: dob, telegram_id: telegram_id })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('form-view').style.display = 'none';
                    document.getElementById('success-view').style.display = 'block';
                    document.getElementById('first-name').textContent = data.first_name || '';
                    
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    }
                } else {
                    errorDiv.textContent = data.error || 'Erreur lors de la liaison du compte.';
                    errorDiv.style.display = 'block';
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                    }
                }
            } catch (e) {
                errorDiv.textContent = 'Erreur de connexion au serveur.';
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
