<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المسار المتعدد الأبعاد (Prototype)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #f8fafc; --surface: #ffffff; --primary: #3b82f6; --border-color: #e2e8f0; --text-1: #1e293b; --text-2: #64748b; --text-3: #94a3b8; }
        body.dark { --bg: #0f172a; --surface: #1e293b; --border-color: #334155; --text-1: #f8fafc; --text-2: #cbd5e1; --text-3: #64748b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text-1); transition: background 0.3s; padding: 20px 10px 100px 10px; }
        
        /* Segmented Control (3 Views) */
        .view-switcher { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; border: 1px solid var(--border-color); margin-bottom: 24px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .view-btn { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.2s; color: var(--text-2); }
        .view-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 10px rgba(59,130,246,0.3); }

        /* BOTTOM SHEET STYLES */
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000; max-height: 85vh; overflow-y: auto; }
        .bottom-sheet.open { bottom: 0; }
        .sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1999; }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        
        .q-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 10px; margin-bottom: 20px; }
        .q-row { background: var(--bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .q-row.status-correct { border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.05); }
        .q-row.status-wrong { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .q-row-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.9rem; color: var(--text-2); background: var(--surface); border: 1px solid var(--border-color); }
        .status-correct .q-row-icon { color: #10b981; border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .status-wrong .q-row-icon { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .q-lesson-badge { font-size: 0.7rem; background: var(--primary); color: white; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        
        /* Accordion Theme Styles */
        .theme-card { background: var(--surface); border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .theme-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .theme-title { font-weight: bold; font-size: 1.1rem; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
        .theme-content { padding: 0 16px 16px 16px; display: none; }
        .theme-card.open .theme-content { display: block; }
        
        .subtheme-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 8px; background: var(--bg); margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
        .subtheme-row:hover { border-color: var(--primary); }

        /* Timeline Styles */
        .timeline-container { position: relative; padding-right: 20px; }
        .timeline-container::before { content: ''; position: absolute; top: 0; bottom: 0; right: 9px; width: 2px; background: var(--border-color); }
        .timeline-item { position: relative; padding-right: 20px; margin-bottom: 20px; }
        .timeline-dot { position: absolute; right: -24px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 4px solid var(--surface); }
    </style>
</head>
<body class="dark">
    <div style="text-align:center; margin-bottom: 24px;">
        <h2 style="color:var(--primary); font-weight:800; font-size:1.5rem;">التدريب الذكي</h2>
        <p style="color:var(--text-2); font-size:0.9rem; margin-top:5px; margin-bottom: 20px;">كيف تفضل استعراض الأسئلة؟</p>
        
        <!-- 3-View Switcher -->
        <div class="view-switcher">
            <div class="view-btn active" onclick="switchView('lesson')" id="btn-lesson"><i class="fa-solid fa-list-ol"></i> حسب الدرس</div>
            <div class="view-btn" onclick="switchView('theme')" id="btn-theme"><i class="fa-solid fa-folder-tree"></i> حسب الموضوع</div>
            <div class="view-btn" onclick="switchView('chrono')" id="btn-chrono"><i class="fa-solid fa-clock-rotate-left"></i> التسلسل الزمني</div>
        </div>
    </div>

    <div id="smart-tracker-container" style="display:flex; flex-direction:column; gap:20px; max-width:600px; margin:0 auto;">
        <!-- Injected by JS -->
    </div>
    
    <!-- BOTTOM SHEET -->
    <div class="sheet-overlay" id="journey-sheet-overlay" onclick="closeJourneySheet()"></div>
    <div class="bottom-sheet" id="journey-bottom-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
                <h2 id="sheet-title" style="font-size:1.2rem; color:var(--text-1);">العنوان</h2>
                <div id="sheet-subtitle" style="font-size:0.8rem; color:var(--text-3); margin-top:4px;"></div>
            </div>
            <button onclick="closeJourneySheet()" style="background:var(--border-color); border:none; width:32px; height:32px; border-radius:50%; color:var(--text-1);"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <button id="btn-play-all-lesson" onclick="playWholeLesson()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; margin-bottom:15px; box-shadow:0 4px 10px rgba(79,70,229,0.3);">
            🎮 ابدأ التدريب
        </button>
        
        <div class="q-grid" id="journey-q-grid">
            <!-- Question rows injected by JS -->
        </div>
    </div>
    
    <script>
        let currentView = 'lesson';
        
        // 1. RICH FAKE DATA (Multi-dimensional Taxonomy)
        window.quranData = [];
        
        // Mock data mapping
        const mockStructure = [
            { lesson: 1, theme: "العهد المكي", subTheme: "الطفولة والشباب", chrono: "قبل البعثة", qCount: 4 },
            { lesson: 2, theme: "العهد المكي", subTheme: "نزول الوحي", chrono: "البعثة", qCount: 3 },
            { lesson: 3, theme: "العهد المكي", subTheme: "الدعوة السرية", chrono: "السنة 1-3 للبعثة", qCount: 5 },
            { lesson: 4, theme: "العهد المكي", subTheme: "الجهر بالدعوة", chrono: "السنة 4 للبعثة", qCount: 4 },
            { lesson: 5, theme: "العهد المكي", subTheme: "الهجرة للحبشة", chrono: "السنة 5 للبعثة", qCount: 4 },
            { lesson: 6, theme: "الهجرة", subTheme: "بيعة العقبة", chrono: "السنة 12-13 للبعثة", qCount: 3 },
            { lesson: 7, theme: "الهجرة", subTheme: "طريق الهجرة", chrono: "السنة 1 للهجرة", qCount: 5 },
            { lesson: 8, theme: "العهد المدني", subTheme: "بناء المسجد", chrono: "السنة 1 للهجرة", qCount: 3 },
            { lesson: 9, theme: "العهد المدني", subTheme: "غزوة بدر", chrono: "السنة 2 للهجرة", qCount: 6 },
            { lesson: 10, theme: "العهد المدني", subTheme: "غزوة أحد", chrono: "السنة 3 للهجرة", qCount: 5 }
        ];

        let fakeId = 1;
        mockStructure.forEach(item => {
            for (let i = 0; i < item.qCount; i++) {
                window.quranData.push({ 
                    id: fakeId++, 
                    subject: 'sira', 
                    lessonNum: item.lesson,
                    theme: item.theme,
                    subTheme: item.subTheme,
                    hijriYear: item.chrono,
                    title: `سؤال حول ${item.subTheme} (${i+1})`
                });
            }
        });
        
        // 2. MOCK PROGRESS
        let mockCorrect = [1, 2, 3, 5, 8, 9, 10, 11, 20, 21, 22];
        let mockWrong = [4, 6, 7, 23];
        localStorage.setItem('quiz_correct_ids', JSON.stringify(mockCorrect));
        localStorage.setItem('quiz_wrong_ids', JSON.stringify(mockWrong));

        function switchView(viewName) {
            currentView = viewName;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + viewName).classList.add('active');
            renderView();
        }

        function getProgress(qs) {
            let correctIds = JSON.parse(localStorage.getItem('quiz_correct_ids') || '[]');
            let count = 0;
            qs.forEach(q => { if (correctIds.includes(q.id)) count++; });
            let percent = qs.length > 0 ? Math.round((count / qs.length) * 100) : 0;
            return { count, total: qs.length, percent, isDone: percent === 100 };
        }

        function renderProgressRing(prog) {
            let color = prog.isDone ? '#10b981' : 'var(--primary)';
            let offset = 125.6 - (125.6 * prog.percent / 100);
            return `
            <div style="position:relative; width:45px; height:45px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--surface); box-shadow:0 2px 5px rgba(0,0,0,0.1); flex-shrink:0;">
                <svg width="45" height="45" style="position:absolute; top:0; left:0; transform:rotate(-90deg);">
                    <circle cx="22.5" cy="22.5" r="20" fill="none" stroke="var(--border-color)" stroke-width="3"></circle>
                    <circle cx="22.5" cy="22.5" r="20" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="${offset}" style="transition:0.5s;"></circle>
                </svg>
                <span style="font-size:0.75rem; font-weight:bold; color:var(--text-2); z-index:1;">${prog.percent}%</span>
            </div>`;
        }

        function renderView() {
            const container = document.getElementById('smart-tracker-container');
            container.innerHTML = '';
            
            if (currentView === 'lesson') {
                // VIEW A: BY LESSON
                let lessons = {};
                window.quranData.forEach(q => {
                    if(!lessons[q.lessonNum]) lessons[q.lessonNum] = { title: `الدرس ${q.lessonNum}`, qs: [] };
                    lessons[q.lessonNum].qs.push(q);
                });

                Object.keys(lessons).sort((a,b)=>a-b).forEach(k => {
                    let l = lessons[k];
                    let prog = getProgress(l.qs);
                    let cardColor = prog.isDone ? 'rgba(16, 185, 129, 0.05)' : 'var(--bg)';
                    let borderColor = prog.isDone ? '#10b981' : 'var(--border-color)';
                    let titleColor = prog.isDone ? '#10b981' : 'var(--text-1)';
                    
                    container.innerHTML += `
                        <div onclick="openSheet('${l.title}', 'تمرين شامل على الدرس', ${JSON.stringify(l.qs).replace(/"/g, '&quot;')})" style="background:${cardColor}; border:1px solid ${borderColor}; border-radius:12px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                ${renderProgressRing(prog)}
                                <div>
                                    <div style="font-weight:bold; font-size:1rem; color:${titleColor};">${l.title}</div>
                                    <div style="font-size:0.8rem; color:var(--text-3);">${prog.count} من ${prog.total} مكتمل</div>
                                </div>
                            </div>
                            <div style="color:var(--text-3);"><i class="fa-solid fa-chevron-left"></i></div>
                        </div>
                    `;
                });
                
            } else if (currentView === 'theme') {
                // VIEW B: BY THEME (TAXONOMY)
                let themes = {};
                window.quranData.forEach(q => {
                    if(!themes[q.theme]) themes[q.theme] = {};
                    if(!themes[q.theme][q.subTheme]) themes[q.theme][q.subTheme] = [];
                    themes[q.theme][q.subTheme].push(q);
                });

                Object.keys(themes).forEach(tName => {
                    let subThemes = themes[tName];
                    let themeQs = [];
                    Object.values(subThemes).forEach(qs => themeQs = themeQs.concat(qs));
                    let themeProg = getProgress(themeQs);
                    
                    let html = `
                    <div class="theme-card" onclick="this.classList.toggle('open')">
                        <div class="theme-header">
                            <div class="theme-title"><i class="fa-solid fa-folder" style="color:var(--primary);"></i> ${tName}</div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span style="font-size:0.8rem; font-weight:bold; color:var(--text-2);">${themeProg.percent}%</span>
                                <i class="fa-solid fa-chevron-down" style="color:var(--text-3); font-size:0.8rem;"></i>
                            </div>
                        </div>
                        <div class="theme-content">
                    `;
                    
                    Object.keys(subThemes).forEach(stName => {
                        let qs = subThemes[stName];
                        let prog = getProgress(qs);
                        let dotColor = prog.isDone ? '#10b981' : (prog.percent > 0 ? '#f59e0b' : 'var(--text-3)');
                        
                        html += `
                            <div class="subtheme-row" onclick="event.stopPropagation(); openSheet('${stName}', 'موضوع: ${tName}', ${JSON.stringify(qs).replace(/"/g, '&quot;')})">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <div style="width:8px; height:8px; border-radius:50%; background:${dotColor};"></div>
                                    <div style="font-size:0.9rem; font-weight:bold; color:var(--text-1);">${stName}</div>
                                </div>
                                <div style="font-size:0.8rem; color:var(--text-3);">${prog.count}/${prog.total}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                    container.innerHTML += html;
                });
                
            } else if (currentView === 'chrono') {
                // VIEW C: BY TIMELINE
                let chronos = {};
                window.quranData.forEach(q => {
                    if(!chronos[q.hijriYear]) chronos[q.hijriYear] = [];
                    chronos[q.hijriYear].push(q);
                });
                
                let html = `<div class="timeline-container">`;
                Object.keys(chronos).forEach(year => {
                    let qs = chronos[year];
                    let prog = getProgress(qs);
                    html += `
                        <div class="timeline-item" onclick="openSheet('${year}', 'الفترة الزمنية', ${JSON.stringify(qs).replace(/"/g, '&quot;')})">
                            <div class="timeline-dot"></div>
                            <div style="background:var(--surface); border:1px solid var(--border-color); border-radius:12px; padding:12px; cursor:pointer;">
                                <div style="font-weight:bold; color:var(--primary); margin-bottom:4px;">${year}</div>
                                <div style="font-size:0.85rem; color:var(--text-2); display:flex; justify-content:space-between;">
                                    <span>${qs.length} أسئلة في هذه الفترة</span>
                                    <span style="font-weight:bold;">${prog.percent}%</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            }
        }

        function openSheet(title, subtitle, questions) {
            document.getElementById('sheet-title').innerText = title;
            document.getElementById('sheet-subtitle').innerText = subtitle;
            
            const grid = document.getElementById('journey-q-grid');
            grid.innerHTML = '';
            
            let correctIds = JSON.parse(localStorage.getItem('quiz_correct_ids') || '[]');
            let wrongIds = JSON.parse(localStorage.getItem('quiz_wrong_ids') || '[]');
            
            let progressProg = getProgress(questions);
            
            questions.forEach((q, idx) => {
                const row = document.createElement('div');
                row.className = 'q-row';
                
                let qStatus = 'unanswered';
                if (correctIds.includes(q.id)) qStatus = 'correct';
                else if (wrongIds.includes(q.id)) qStatus = 'wrong';
                
                if(qStatus === 'correct') row.classList.add('status-correct');
                if(qStatus === 'wrong') row.classList.add('status-wrong');
                
                let icon = qStatus === 'correct' ? '<i class="fa-solid fa-check"></i>' : (qStatus === 'wrong' ? '<i class="fa-solid fa-xmark"></i>' : (idx + 1));
                
                // Show lesson badge only if we are not in the "Lesson" view
                let badgeHtml = currentView !== 'lesson' ? `<div class="q-lesson-badge">الدرس ${q.lessonNum}</div>` : '';
                
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div class="q-row-icon">${icon}</div>
                        <div style="font-size:0.9rem; font-weight:bold; color:var(--text-1);">${q.title}</div>
                    </div>
                    ${badgeHtml}
                `;
                
                row.onclick = () => {
                    alert(`في التطبيق النهائي، سيفتح السؤال رقم ${q.id} (مصدره الدرس ${q.lessonNum})`);
                };
                grid.appendChild(row);
            });
            
            const btn = document.getElementById('btn-play-all-lesson');
            if(progressProg.isDone) {
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> إعادة التدريب';
                btn.style.background = 'var(--text-2)';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> ابدأ التدريب';
                btn.style.background = 'var(--primary)';
            }
            
            document.getElementById('journey-bottom-sheet').classList.add('open');
            document.getElementById('journey-sheet-overlay').classList.add('open');
        }
        
        function closeJourneySheet() {
            document.getElementById('journey-bottom-sheet').classList.remove('open');
            document.getElementById('journey-sheet-overlay').classList.remove('open');
        }
        
        function playWholeLesson() {
            alert('سيبدأ التدريب على هذه المجموعة المحددة.');
        }

        // INIT
        renderView();
    </script>
</body>
</html>
