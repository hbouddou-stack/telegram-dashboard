<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز الدعم الذكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #1e0033 0%, #000b29 100%);
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #ffffff;
            --text-1: #ffffff;
            --text-2: #b3a5c7;
            --accent: #8736ff;
            --card-hover: rgba(135, 54, 255, 0.2);
            --rag-bg: rgba(46, 204, 113, 0.1);
            --rag-border: #2ecc71;
        }
        html, body {
            background-color: #000b29;
            background-image: var(--bg);
            color: var(--text-1);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            animation: fadeInDown 0.5s ease;
        }
        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }
        p.subtitle {
            margin: 5px 0 0 0;
            color: var(--text-2);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .step-container {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .step-container.active {
            display: block;
        }
        
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .card:hover, .card:active {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .card-icon {
            font-size: 2rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
        }
        textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-1);
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            resize: none;
            min-height: 150px;
        }
        textarea:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,0.5);
        }
        
        button.btn-primary, button.btn-secondary, button.btn-success, button.btn-danger {
            color: var(--text-1);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        button.btn-primary {
            background: linear-gradient(90deg, var(--accent) 0%, #5721d9 100%);
            box-shadow: 0 4px 15px rgba(135, 54, 255, 0.4);
        }
        button.btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 10px;
        }
        button.btn-success {
            background: #2ecc71;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        button.btn-danger {
            background: #e74c3c;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-screen .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .rag-box {
            background: var(--rag-bg);
            border: 2px solid var(--rag-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: right;
        }
        .rag-title {
            color: var(--rag-border);
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rag-answer {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-1);
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        .dot.active {
            background: var(--accent);
            transform: scale(1.2);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container" id="support-form">
        <div class="header">
            <div class="header-icon">🤖</div>
            <h1>مركز الدعم الذكي</h1>
            <p class="subtitle" id="step-subtitle">ما هو نوع المشكلة التي تواجهها؟</p>
            
            <div class="step-indicator">
                <div class="dot active" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div>
            </div>
        </div>
        
        <!-- STEP 1: Main Category -->
        <div class="step-container active" id="step-1">
            <div class="grid-cards" id="theme-grid">
                <!-- Generated by JS -->
            </div>
        </div>
        
        <!-- STEP 2: Sub Category -->
        <div class="step-container" id="step-2">
            <div class="grid-cards" id="subtheme-grid">
                <!-- Generated by JS -->
            </div>
            <button class="btn-secondary" onclick="goToStep(1)">🔙 رجوع</button>
        </div>
        
        <!-- STEP 3: Message -->
        <div class="step-container" id="step-3">
            <div class="input-group">
                <label>اشرح مشكلتك بالتفصيل:</label>
                <textarea id="message" placeholder="اكتب هنا كافة التفاصيل التي قد تساعدنا في حل مشكلتك..."></textarea>
            </div>
            
            <button class="btn-primary" id="btn-submit" onclick="submitTicket()">🚀 إرسال</button>
            <button class="btn-secondary" onclick="goToStep(2)">🔙 رجوع</button>
        </div>

        <!-- STEP 4: RAG Interception -->
        <div class="step-container" id="step-4">
            <div class="rag-box">
                <div class="rag-title">💡 المساعد الذكي يقترح:</div>
                <div class="rag-answer" id="rag-answer-text"></div>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
                <p style="text-align: center; font-weight: 700;">هل حلت هذه الإجابة مشكلتك؟</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-success" onclick="resolveTicket()">✅ نعم، شكراً</button>
                    <button class="btn-danger" onclick="escalateTicket()">❌ لا، أريد التحدث لمدير</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container success-screen" id="success-screen">
        <div class="icon">✅</div>
        <h2 style="color:var(--accent);">تم الاستلام بنجاح</h2>
        <p style="color:var(--text-2); line-height: 1.6;" id="success-msg">تم إرسال تذكرتك إلى فريق الدعم. سنقوم بالرد عليك في أقرب وقت ممكن عبر هذه المحادثة.</p>
        <button class="btn-primary" style="margin-top:20px;" onclick="window.Telegram.WebApp.close()">إغلاق</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        setTimeout(() => { window.scrollTo(0, 0); }, 100);

        let selectedTheme = "";
        let selectedSubtheme = "";

        // Core data logic
        const themes = [
            { id: "tech", icon: "⚙️", text: "تقني" },
            { id: "finance", icon: "💳", text: "مالي" },
            { id: "course", icon: "📚", text: "دعم الدروس" },
            { id: "exam", icon: "📝", text: "امتحان" }
        ];

        const subthemesData = {
            "تقني": [
                {icon: "🔑", text: "لا أستطيع تسجيل الدخول"},
                {icon: "🎬", text: "الفيديو لا يعمل"},
                {icon: "🔈", text: "مشكلة في الصوت"},
                {icon: "📝", text: "مشكلة أخرى"}
            ],
            "مالي": [
                {icon: "💳", text: "طرق الدفع المتاحة"},
                {icon: "⏳", text: "تم خصم المبلغ ولم يتفعل الحساب"},
                {icon: "🧾", text: "تأكيد وصل الدفع"},
                {icon: "📝", text: "مشكلة أخرى"}
            ],
            "دعم الدروس": [
                {icon: "📂", text: "أين أجد ملفات الدورة؟"},
                {icon: "❓", text: "سؤال علمي عن الدرس"},
                {icon: "📝", text: "مشكلة في تحميل المرفقات"},
                {icon: "📝", text: "مشكلة أخرى"}
            ],
            "امتحان": [
                {icon: "📅", text: "متى موعد الاختبار؟"},
                {icon: "🎓", text: "متى أستلم شهادتي؟"},
                {icon: "❓", text: "كيف أقدم الاختبار؟"},
                {icon: "📝", text: "مشكلة أخرى"}
            ]
        };

        // Render Themes
        const themeGrid = document.getElementById('theme-grid');
        themes.forEach(t => {
            const card = document.createElement('div');
            card.className = 'card';
            if (t.span === 2) card.style.gridColumn = 'span 2';
            card.onclick = () => selectTheme(t.text);
            card.innerHTML = `<div class="card-icon">${t.icon}</div><div class="card-title">${t.text}</div>`;
            themeGrid.appendChild(card);
        });

        function goToStep(step) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${step}`).classList.add('active');
            
            document.querySelectorAll('.dot').forEach(el => el.classList.remove('active'));
            for(let i=1; i<=Math.min(step, 3); i++) {
                document.getElementById(`dot-${i}`).classList.add('active');
            }

            const subtitle = document.getElementById('step-subtitle');
            if(step === 1) subtitle.innerText = "ما هو نوع المشكلة التي تواجهها؟";
            if(step === 2) subtitle.innerText = "حدد التفاصيل الدقيقة للمشكلة:";
            if(step === 3) subtitle.innerText = "الخطوة الأخيرة: اكتب رسالتك للإدارة.";
            if(step === 4) subtitle.innerText = "اقتراح ذكي للمساعدة";
        }

        function selectTheme(themeText) {
            selectedTheme = themeText;
            const grid = document.getElementById('subtheme-grid');
            grid.innerHTML = '';
            
            const subs = subthemesData[themeText] || [];
            subs.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectSubtheme(sub.text);
                card.innerHTML = `<div class="card-icon">${sub.icon}</div><div class="card-title">${sub.text}</div>`;
                grid.appendChild(card);
            });
            
            goToStep(2);
        }

        function selectSubtheme(subtheme) {
            selectedSubtheme = subtheme;
            goToStep(3);
        }

        async function submitTicket() {
            const msg = document.getElementById('message').value.trim();
            
            if (!msg) {
                alert("يرجى كتابة رسالتك بوضوح.");
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.textContent = "جاري البحث...";
            btn.disabled = true;
            
            // Check RAG first
            try {
                const ragRes = await fetch('/api/support/rag_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme: selectedTheme, subtheme: selectedSubtheme, message: msg })
                });
                
                const ragData = await ragRes.json();
                
                if (ragData.found) {
                    document.getElementById('rag-answer-text').innerText = ragData.answer;
                    goToStep(4);
                    return; // Stop here, wait for user decision
                }
            } catch (e) {
                console.error("RAG Error", e);
            }
            
            // If RAG not found or failed, escalate directly
            escalateTicket(false);
        }

        function resolveTicket() {
            document.getElementById('support-form').style.display = 'none';
            document.getElementById('success-msg').innerText = "يسعدنا أن المشكلة حُلت! شكراً لاستخدامك مركز الدعم الذكي.";
            document.getElementById('success-screen').style.display = 'block';
        }

        async function escalateTicket(ragFailed = true) {
            const msg = document.getElementById('message').value.trim();
            
            let tid = null;
            let username = "غير متوفر";
            let first_name = "غير متوفر";
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tid = window.Telegram.WebApp.initDataUnsafe.user.id;
                username = window.Telegram.WebApp.initDataUnsafe.user.username || "";
                first_name = window.Telegram.WebApp.initDataUnsafe.user.first_name || "";
            }
            
            try {
                const response = await fetch('/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        theme: selectedTheme, 
                        subtheme: selectedSubtheme, 
                        message: msg, 
                        telegram_id: tid,
                        username: username,
                        first_name: first_name,
                        rag_failed: ragFailed
                    })
                });
                
                document.getElementById('support-form').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            } catch (e) {
                alert("حدث خطأ في الإرسال. يرجى المحاولة لاحقاً.");
                const btn = document.getElementById('btn-submit');
                btn.textContent = "🚀 إرسال";
                btn.disabled = false;
                if(ragFailed) goToStep(4); else goToStep(3);
            }
        }
    </script>
</body>
</html>
