<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدكز المساعحد</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #1e0033 0%, #000b29 100%);
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #ffffff;
            --text-1: #ffffff;
            --text-2: #b3a5c7;
            --accent: #8736ff;
            --card-hover: rgba(135, 54, 255, 0.2);
        }
        html, body {
            background-color: #000b29;
            background-image: var(--bg);
            color: var(--text-1);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            animation: faceInDown 0.5s ease;
        }
        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }
        p.subtitle {
            margin: 5px 0 0 0;
            color: var(--text-2);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .step-container {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .step-container.active {
            display: block;
        }
        
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .card:hover, .card:active {
            background: var(--card-hover);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .card-icon {
            font-size: 2rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1rem;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
        }
        textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-1);
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            resize: none;
            min-height: 150px;
        }
        textarea:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,0.5);
        }
        
        button.btn-primary, button.btn-secondary {
            color: var(--text-1);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        button.btn-primary {
            background: linear-gradient(90deg, var(--accent) 0%, #5721d9 100%);
            box-shadow: 0 4px 15px rgba(135, 54, 255, 0.4);
        }
        button.btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 10px;
        }
        button.btn-primary:active, button.btn-secondary:active {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-screen .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        .dot.active {
            background: var(--accent);
            transform: scale(1.2);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container" id="support-form">
        <div class="header">
            <div class="header-icon">𝓬</div>
            <h1>مركز المساعدة</h1>
            <p class="subtitle" id="step-subtitle">ما هو نوع المشكلة ال�ي تواجهها?</p>
            
            <div class="step-indicator">
                <div class="dot active" id="dot-1"></div>
                <div class="dot" id="dot-2"></div>
                <div class="dot" id="dot-3"></div>
            </div>
        </div>
        
        <!-- STEP 1: Main Category -->
        <div class="step-container active" id="step-1">
            <div class="grid-cards">
                <div class="card" onclick="selectTheme('التقنية')">
                    <div class="card-icon">⚙️</div>
                    <div class="card-title">مشكلة تقنية</div>
                </div>
                <div class="card" onclick="selectTheme('❄لتسجيل')">
                    <div class="card-icon">📜</div>
                    <div class="card-title">التسجيل</div>
                </div>
                <div class="card" onclick="selectTheme('الحد�a')">
                    <div class="card-icon">📱</div>
                    <div class="card-title">الدفع المالي</div>
                </div>
                <div class="card" onclick="selectTheme('ال�روس')">
                    <div class="card-icon">📚</div>
                    <div class="card-title">الدروس</div>
                </div>
                <div class="card" style="grid-column: span 2;" onclick="selectTheme('الامتحانات')">
                    <div class="card-icon">🎓</div>
                    <div class="card-title">الامتحانات</div>
                </div>
            </div>
        </div>
        
        <!-- STEP 2: Sub Category -->
        <div class="step-container" id="step-2">
            <div class="grid-cards" id="subtheme-grid">
                <!-- Generated by JS -->
            </div>
            <button class="btn-secondary" onclick="goToStep(1)">📕 رجوع</button>
        </div>
        
        <!-- STEP 3: Message -->
        <div class="step-container" id="step-3">
            <div class="input-group">
                <label>اشرح مشكلتك بالتفصيٌ:</label>
                <textarea id="message" placeholder="اكتب تفاصيل المشتلة بوضوح لنتمكن من مساعدتك بأسرع وقت..."></textarea>
            </div>
            
            <button class="btn-primary" id="btn-submit" onclick="submitTicket()">🚀 إرسال الطلت</button>
            <button class="btn-secondary" onclick="goToStep(2)">📕 رجوع</button>
        </div>
    </div>
    
    <div class="container success-screen" id="success-screen">
        <div class="icon">✅</div>
        <h2 style="color:var(--accent);">تم ال�رسال بنجاح</h2>
        <p style="color:var(--text-2); line-height: 1.6;">لفد استلمنا رسالتك وسيقوم فريق الدعم بالرد عليй في أدرب وقت ممكن عبر رسالة خاصة في تيليجرام.</p>
        <button class="btn-primary" style="margin-top:20px;" onclick="window.Telegram.WebApp.close()">اغلاق</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        setTimeout(() => { window.scrollTo(0, 0); }, 100);

        let selectedTheme = "";
        let selectedSubtheme = "";

        const subthemesData = {
            "التقنية": [
                {icon: "�쏯", text: "لا أستٷيع تسجيل الدخول"},
                {icon: "🎬", text: "الفيديو لا يعمل"},
                {icon: "🐌", text: "المنصة بطيئة"},
                {icon: "⎓", text: "مشكلة أخرو"}
            ],
            "التسجيل": [
                {icon: "📧", text: "لم أستلم بريد التأكيد"},
                {icon: "❌", text: "بياناتي خاطئة"},
                {icon: "⎓", text: "مش؃لة أخرو"}
            ],
            "الدفع": [
                {icon: "🚫", text: "�شلt عملية الدفع"},
                {icon: "📧", text: "استفسار عن الفاتورة"},
                {icon: "⎑", text: "مشكلة أخرو"}
            ],
            "الدروس": [
                {icon: "🔍", text: "أين أحد الدرس?"},
                {icon: "🤔", text: "الدرس غير مفهوم"},
                {icon: "📥", text: "مش؃لة في تحميل الملفات"},
                {icon: "⎑", text: "مشكلة أخرو"}
            ],
            "الامحانات": [
                {icon: "📓", text: "متى موعد الامتحان?"},
                {icon: "⚠️", text: "مش؃لة أتناء الامتحان"},
                {icon: "💚", text: "استفسار عن النتيجة"},
                {icon: "⎑", text: "مشكلة أخرو"}
            ]
        };

        function goToStep(step) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${step}`).classList.add('active'));
            
            document.querySelectorAll('.dot').forEach(el => el.classList.remove('active'));
            for(let i=1; i<=step; i++) {
                document.getElementById(`dot-${i}`).classList.add('active');
            }

            const subtitle = document.getElementById('step-subtitle');
            if(step === 1) subtitle.innerText = "ما هو نوع المشكلة التي تواجهها��";
            if(step === 2) subtitle.innerText = "حدد التفاصيل الدقيقة للمشكلة:";
            if(step === 3) subtitle.innerText = "الخطوة الأخيرة: اكتب رسالتك للإدارة.";
        }

        function selectTheme(theme) {
            selectedTheme = theme;
            const grid = document.getElementById('subtheme-grid');
            grid.innerHTML = '';
            
            subthemesData[theme].forEach(sub => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => selectSubtheme(sub.text);
                card.innerHTML = `
                    <div class="card-icon">${sub.icon}</div>
                    <div class="card-title">${sub.text}</div>
                `;
                grid.appendChild(card);
            });
            
            goToStep(2);
        }

        function selectSubtheme(subtheme) {
            selectedSubtheme = subtheme;
            goToStep(3);
        }

        async function submitTicket() {
            const msg = document.getElementById('message').value.trim();
            
            if (!msg) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
                    window.Telegram.WebApp.showAlert("يرجى كتابة تفاصيل  المشكلة أولث.");
                } else {
                    alert("يرجى كتابة تفاصيل  المشكلة أولث.");
                }
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.textContent = "جاري الإردف...";
            btn.disabled = true;
            
            let tid = null;
            let username = "";
            let first_name = "";
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tid = window.Telegram.WebApp.initDataUnsafe.user.id;
                username = window.Telegram.WebApp.initDataUnsafe.user.username || "";
                first_name = window.Telegram.WebApp.initDataUnsafe.user.first_name || "";
            }
            
            try {
                const response = await fetch('/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        theme: selectedTheme, 
                        subtheme: selectedSubtheme, 
                        message: msg, 
                        telegram_id: tid,
                        username: username,
                        first_name: first_name
                    })
                });
                
                document.getElementById('support-form').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            } catch (e) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
                    window.Telegram.WebApp.showAlert("❌ حدث خطأ. يرجى المحاولة لاحقخا.");
                } else {
                    alert("❌ حدث خطأ. يرجى المحاولة لاحقخا.");
                }
                btn.textContent = "🚀 إرسال الطلب";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
