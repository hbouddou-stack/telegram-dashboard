function switchTab(tabName, btnEl) {
    try { trackAnalytics('tab_click', '', false, tabName); } catch(e) {}
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetTab = document.getElementById('tab-' + tabName);
    if (targetTab) targetTab.classList.add('active');
    
    if (btnEl) {
        btnEl.classList.add('active');
    } else {
        const targetBtn = document.getElementById('btn-nav-' + tabName);
        if (targetBtn) targetBtn.classList.add('active');
    }
    
    if (tabName === 'faq') loadStudentFaq();
    if (tabName === 'inbox') loadStudentTickets();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

let currentStoryIdx = 0;
let currentSlideIdx = 0;
let storySlideTimer = null;
const SLIDE_DURATION = 5000;

function openStoryViewer(storyIdx) {
    currentStoryIdx = storyIdx;
    currentSlideIdx = 0;
    const modal = document.getElementById('story-viewer-modal');
    if (!modal) return;
    modal.style.display = 'flex';
    renderStorySlide();
}

function closeStoryViewer() {
    clearTimeout(storySlideTimer);
    const modal = document.getElementById('story-viewer-modal');
    if (modal) modal.style.display = 'none';
}

function renderStorySlide() {
    clearTimeout(storySlideTimer);
    const story = ACADEMY_STORIES[currentStoryIdx];
    if (!story || !story.slides[currentSlideIdx]) return;
    
    const slide = story.slides[currentSlideIdx];
    document.getElementById('story-author-icon').innerText = story.icon;
    document.getElementById('story-author-title').innerText = story.title;
    document.getElementById('story-slide-icon').innerText = slide.icon;
    document.getElementById('story-slide-title').innerText = slide.title;
    document.getElementById('story-slide-text').innerText = slide.text;
    document.getElementById('story-slide-btn').innerText = slide.btnText;
    
    const progContainer = document.getElementById('story-progress-container');
    progContainer.innerHTML = story.slides.map((_, idx) => {
        let fillStyle = 'width: 0%;';
        if (idx < currentSlideIdx) fillStyle = 'width: 100%;';
        else if (idx === currentSlideIdx) fillStyle = 'width: 0%; transition: width 5s linear;';
        return '<div class="story-progress-seg"><div class="story-progress-fill" id="story-prog-' + idx + '" style="' + fillStyle + '"></div></div>';
    }).join('');
    
    setTimeout(() => {
        const curProg = document.getElementById('story-prog-' + currentSlideIdx);
        if (curProg) curProg.style.width = '100%';
    }, 50);

    storySlideTimer = setTimeout(() => {
        nextStorySlide();
    }, SLIDE_DURATION);
}

function nextStorySlide() {
    const story = ACADEMY_STORIES[currentStoryIdx];
    if (currentSlideIdx < story.slides.length - 1) {
        currentSlideIdx++;
        renderStorySlide();
    } else if (currentStoryIdx < ACADEMY_STORIES.length - 1) {
        currentStoryIdx++;
        currentSlideIdx = 0;
        renderStorySlide();
    } else {
        closeStoryViewer();
    }
}

function prevStorySlide() {
    if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderStorySlide();
    } else if (currentStoryIdx > 0) {
        currentStoryIdx--;
        currentSlideIdx = ACADEMY_STORIES[currentStoryIdx].slides.length - 1;
        renderStorySlide();
    }
}

function handleStoryAction() {
    const story = ACADEMY_STORIES[currentStoryIdx];
    const slide = story.slides[currentSlideIdx];
    if (slide.action === 'guide') {
        closeStoryViewer();
        window.location.href = '/guide.html';
    } else if (slide.action === 'ask') {
        closeStoryViewer();
        switchTab('new');
    } else if (slide.action === 'faq') {
        closeStoryViewer();
        switchTab('faq');
    } else if (slide.action === 'close') {
        closeStoryViewer();
    } else {
        nextStorySlide();
    }
}

function filterMediatheque(type, btn) {
    document.querySelectorAll('#mediatheque-modal .faq-cat-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    const videos = document.querySelectorAll('#mediatheque-list .item-video');
    const audios = document.querySelectorAll('#mediatheque-list .item-audio');
    
    if (type === 'all') {
        videos.forEach(v => v.style.display = 'block');
        audios.forEach(a => a.style.display = 'block');
    } else if (type === 'video') {
        videos.forEach(v => v.style.display = 'block');
        audios.forEach(a => a.style.display = 'none');
    } else if (type === 'audio') {
        videos.forEach(v => v.style.display = 'none');
        audios.forEach(a => a.style.display = 'block');
    }
}

let selectedTheme = "";
let selectedSubtheme = "";

function selectTheme(theme) {
    selectedTheme = theme;
    const subContainer = document.getElementById('subthemes-container');
    subContainer.innerHTML = '';
    
    (subthemesData[theme] || []).forEach(sub => {
        const card = document.createElement('div');
        card.className = 'subtheme-card';
        card.innerHTML = '<span style="font-size:1.2rem;">🔹</span> <span>' + sub + '</span>';
        card.onclick = () => selectSubtheme(sub);
        subContainer.appendChild(card);
    });
    goToStep(2);
}

function selectSubtheme(subtheme) {
    selectedSubtheme = subtheme;
    const titleGroup = document.getElementById('custom-title-group');
    const titleInput = document.getElementById('custom-ticket-title');
    if (subtheme === 'مشكلة أخرى') {
        if (titleGroup) titleGroup.style.display = 'block';
        if (titleInput) { titleInput.value = ''; titleInput.focus(); }
    } else {
        if (titleGroup) titleGroup.style.display = 'none';
        if (titleInput) titleInput.value = '';
    }
    goToStep(3);
}

function goToStep(stepNumber) {
    document.querySelectorAll('.step-container').forEach(c => c.classList.remove('active'));
    const target = document.getElementById('step-' + stepNumber);
    if (target) target.classList.add('active');

    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('dot-' + i);
        if (dot) {
            if (i <= stepNumber) dot.classList.add('active');
            else dot.classList.remove('active');
        }
    }

    const sub = document.getElementById('step-subtitle');
    if (sub) {
        if (stepNumber === 1) sub.innerText = "ما هو نوع المشكلة التي تواجهها؟";
        else if (stepNumber === 2) sub.innerText = "اختر تفاصيل مشكلة قسم [" + selectedTheme + "]:";
        else if (stepNumber === 3) sub.innerText = "اشرح استفسارك بالتفصيل وسنساعدك فورا:";
        else if (stepNumber === 4) sub.innerText = "اقتراح ذكي لحل مشكلتك فورا";
    }
}

async function submitTicket() {
    const customTitleInput = document.getElementById('custom-ticket-title');
    if (selectedSubtheme === 'مشكلة أخرى' && customTitleInput) {
        const ct = customTitleInput.value.trim();
        if (!ct) { alert("يرجى كتابة عنوان مختصر للموضوع."); return; }
        selectedSubtheme = ct;
    }
    const msg = document.getElementById('message').value.trim();
    if (!msg) { alert("يرجى كتابة رسالتك بوضوح."); return; }
    
    const btn = document.getElementById('btn-submit');
    btn.textContent = "جاري الفحص الذكي...";
    btn.disabled = true;
    
    try {
        const ragRes = await fetch(BOT_BASE + '/api/support/rag_check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ theme: selectedTheme, subtheme: selectedSubtheme, message: msg })
        });
        const ragData = await ragRes.json();
        if (ragData.found) {
            document.getElementById('rag-answer-text').innerText = ragData.answer;
            goToStep(4);
            btn.textContent = "🚀 إرسال";
            btn.disabled = false;
            return;
        }
    } catch (e) {}
    escalateTicket(false);
}

async function resolveTicket() {
    const msg = document.getElementById('message').value.trim();
    const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
    const uname = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || "";
    const fname = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "";
    try {
        await fetch(BOT_BASE + '/api/support', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ theme: selectedTheme, subtheme: selectedSubtheme, message: msg, telegram_id: tid, username: uname, first_name: fname, rag_failed: false, auto_resolved: true })
        });
    } catch(e) {}
    document.getElementById('support-form').style.display = 'none';
    document.getElementById('success-msg').innerText = "يسعدنا أن المشكلة حُلت! تم حفظ الاستفسار لغرض التحسين.";
    document.getElementById('success-screen').style.display = 'block';
}

async function escalateTicket(ragFailed = true) {
    const msg = document.getElementById('message').value.trim();
    const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
    const username = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || "";
    const first_name = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "";
    
    const fileInput = document.getElementById('attachment');
    let initialFileData = null;
    let initialFileName = null;
    
    if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        initialFileName = file.name;
        initialFileData = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(file);
        });
    }
    
    try {
        await fetch(BOT_BASE + '/api/support', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                theme: selectedTheme, 
                subtheme: selectedSubtheme, 
                message: msg, 
                telegram_id: tid, 
                username, 
                first_name, 
                rag_failed: ragFailed,
                file_data: initialFileData,
                file_name: initialFileName
            })
        });
        document.getElementById('support-form').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
    } catch (e) {
        alert("حدث خطأ في الإرسال. يرجى المحاولة لاحقاً.");
        const btn = document.getElementById('btn-submit');
        if (btn) { btn.textContent = "🚀 إرسال"; btn.disabled = false; }
        goToStep(3);
    }
}

let studentFaqAll = [...defaultFallbackFaq];
let studentFaqLoadedFromApi = false;
let studentFaqActiveCat = null;

async function loadStudentFaq() {
    const listEl = document.getElementById('student-faq-list');
    const catsEl = document.getElementById('student-faq-cats');
    if (studentFaqLoadedFromApi) return;
    try {
        const res = await fetch(BOT_BASE + '/api/faq');
        if (res.ok) {
            const data = await res.json();
            if (data.success && data.entries && data.entries.length > 0) {
                studentFaqAll = data.entries; studentFaqLoadedFromApi = true;
                const rawCats = (data.categories || []).map(c => c ? c.category : null).filter(Boolean);
                const cats = [...new Set(rawCats)];
                
                let catsHtml = '<button class="faq-cat-btn active" onclick="studentFilterCat(null, this)">الكل</button>';
                cats.forEach(c => {
                    if (c) {
                        const escaped = String(c).replace(/'/g, "\\'");
                        catsHtml += '<button class="faq-cat-btn" onclick="studentFilterCat(\'' + escaped + '\', this)">' + c + '</button>';
                    }
                });
                catsEl.innerHTML = catsHtml;
                renderStudentFaq(studentFaqAll);
                return;
            }
        }
        throw new Error("Empty FAQ data");
    } catch (e) {
        studentFaqAll = defaultFallbackFaq;
        let catsHtml = '<button class="faq-cat-btn active" onclick="studentFilterCat(null, this)">الكل</button>';
        const cats = [...new Set(defaultFallbackFaq.map(f => f.category))];
        cats.forEach(c => {
            catsHtml += '<button class="faq-cat-btn" onclick="studentFilterCat(\'' + c + '\', this)">' + c + '</button>';
        });
        catsEl.innerHTML = catsHtml;
        renderStudentFaq(studentFaqAll);
    }
}

function studentFilterCat(cat, btn) {
    studentFaqActiveCat = cat;
    document.querySelectorAll('.faq-cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat ? studentFaqAll.filter(e => e.category === cat) : studentFaqAll;
    renderStudentFaq(filtered);
}

let searchDebounceTimer;
function studentFaqSearch(q) {
    if (!q.trim()) { renderStudentFaq(studentFaqAll); return; }
    const lower = q.toLowerCase();
    const results = studentFaqAll.filter(e => e.question.toLowerCase().includes(lower) || e.answer.toLowerCase().includes(lower));
    renderStudentFaq(results);
    
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        trackAnalytics('search', q.trim(), results.length > 0, '');
    }, 1000);
}

function switchFaqMedia(event, id, mode) {
    if (event) event.stopPropagation();
    const parent = document.getElementById('faqitem-' + id);
    if (!parent) return;
    
    parent.querySelectorAll('.faq-media-tab-btn').forEach(btn => btn.classList.remove('active'));
    const clickedBtn = event.currentTarget || event.target;
    if (clickedBtn) clickedBtn.classList.add('active');
    
    parent.querySelectorAll('.faq-media-pane').forEach(pane => pane.classList.remove('active'));
    const targetPane = document.getElementById('faq-pane-' + mode + '-' + id);
    if (targetPane) targetPane.classList.add('active');
}

function toggleFaqItem(id, el) {
    const wasOpen = el.classList.contains('open');
    document.querySelectorAll('.faq-item.open').forEach(item => item.classList.remove('open'));
    if (!wasOpen) {
        el.classList.add('open');
        const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
        fetch(BOT_BASE + '/api/faq/' + id + '/view', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({telegram_id: tid})
        }).catch(()=>{});
    }
}

async function voteFaq(id, helpful) {
    const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
    try {
        await fetch(BOT_BASE + '/api/faq/' + id + '/vote', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({helpful, telegram_id: tid})
        });
        const yesBtn = document.getElementById('vote-yes-' + id);
        const noBtn = document.getElementById('vote-no-' + id);
        if (helpful) {
            if (yesBtn) { yesBtn.classList.add('voted-yes'); yesBtn.disabled = true; }
            if (noBtn) noBtn.disabled = true;
        } else {
            if (noBtn) { noBtn.classList.add('voted-no'); noBtn.disabled = true; }
            if (yesBtn) yesBtn.disabled = true;
        }
    } catch(e) {}
}

let currentThreadTicketId = null;

function filterStudentInbox(filterType, btn) {
    activeInboxFilter = filterType;
    document.querySelectorAll('#inbox-filter-pills .faq-cat-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

}

async function loadStudentTickets() {
    const list = document.getElementById('student-tickets-list');
    const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
    if (!tid) {
        list.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-2);">لم يتم التعرف على حسابك. افتح التطبيق عبر تليجرام.</div>';
        return;
    }
    try {
        const res = await fetch(BOT_BASE + '/api/tickets/student?telegram_id=' + tid);
        if (res.ok) {
            const data = await res.json();
            if (data.success && data.tickets) {
                studentAllTicketsList = data.tickets;
                renderStudentTickets(data.tickets);
                
                const pendingReplies = data.tickets.filter(t => t.status === 'resolved' || t.status === 'in_progress');
                const homeAlert = document.getElementById('home-ticket-alert');
                if (homeAlert) {
                    if (pendingReplies.length > 0) {
                        homeAlert.style.display = 'block';
                    } else {
                        homeAlert.style.display = 'none';
                    }
                }
            }
        }
    } catch(e) {}
}

function renderStudentTickets(tickets) {
    studentAllTicketsList = tickets || [];
    const list = document.getElementById('student-tickets-list');
    if (!list) return;
    
    studentLoadedTicketsMap = {};

    const resolvedList = studentAllTicketsList.filter(t => t.status === 'resolved' || t.status === 'محلولة');
    const pendingList = studentAllTicketsList.filter(t => !resolvedList.includes(t));
    
    const cntAll = document.getElementById('cnt-all');
    const cntPending = document.getElementById('cnt-pending');
    const cntResolved = document.getElementById('cnt-resolved');
    if (cntAll) cntAll.innerText = studentAllTicketsList.length;
    if (cntPending) cntPending.innerText = pendingList.length;
    if (cntResolved) cntResolved.innerText = resolvedList.length;

    const badge = document.getElementById('inbox-badge');
    if (badge) {
        if (pendingList.length > 0) {
            badge.innerText = pendingList.length;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }
    }

    if (!studentAllTicketsList || studentAllTicketsList.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:40px 20px; background:var(--surface); border-radius:16px; border:1px dashed rgba(255,255,255,0.15); margin-top:10px; max-width:480px; margin-left:auto; margin-right:auto;"><div style="font-size:3rem; margin-bottom:15px;">📫</div><h3 style="font-size:1.1rem; margin:0 0 10px 0; color:var(--text-1);">صندوق الرسائل فارغ</h3><p style="font-size:0.88rem; color:var(--text-2); line-height:1.6; margin:0 0 20px 0;">ستظهر هنا جميع تذاكر الدعم ومتابعة الردود من إدارة الأكاديمية أولاً بأول.</p><button class="btn-primary" style="width:auto; padding:12px 28px; margin:0 auto; display:inline-flex; align-items:center; gap:8px;" onclick="switchTab(\'new\')"><span>✍️</span> فتح تذكرة جديدة</button></div>';
        return;
    }

    let displayTickets = [...studentAllTicketsList];
    if (activeInboxFilter === 'pending') {
        displayTickets = pendingList;
    } else if (activeInboxFilter === 'resolved') {
        displayTickets = resolvedList;
    }

    displayTickets.sort((a,b) => (new Date(b.timestamp || 0)) - (new Date(a.timestamp || 0)));

    if (displayTickets.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-2); padding:30px;">لا توجد تذاكر في هذا التصنيف.</div>';
        return;
    }

    list.innerHTML = displayTickets.map(t => {
        studentLoadedTicketsMap[t.id] = t;
        const isResolved = (t.status === 'resolved' || t.status === 'محلولة');
        const isInProgress = (t.status === 'in_progress' || t.status === 'قيد المعالجة');
        const statusColor = isResolved ? '#2ecc71' : (isInProgress ? '#3498db' : '#f39c12');
        const statusBg = isResolved ? 'rgba(46,204,113,0.1)' : (isInProgress ? 'rgba(52,152,219,0.1)' : 'rgba(243,156,18,0.1)');
        const statusLabel = isResolved ? '🟢 تم الحل' : (isInProgress ? '🔵 قيد المعالجة' : '🟠 في انتظار الرد');
        const cardTint = isResolved ? 'rgba(46,204,113,0.03)' : 'rgba(243,156,18,0.03)';
        
        const date = t.timestamp ? new Date(t.timestamp).toLocaleDateString('ar-MA') : '';
        const themeName = t.theme || 'عام';
        const subthemeName = t.subtheme || '';
        const messageSnippet = (t.message || t.text || '').split('\n').join(' ').trim().substring(0, 42);
        const hasAttachment = (t.has_attachment == 1 || t.file_path || t.file_data || (t.conversation && t.conversation.includes('file_data')) || (t.message && t.message.includes('[مرفق]')));
        const attachBadge = hasAttachment ? '<span style="background:rgba(241,196,15,0.15); color:var(--accent); border:1px solid rgba(241,196,15,0.35); padding:2px 8px; border-radius:6px; font-size:0.75rem; display:inline-flex; align-items:center; gap:4px; font-weight:bold;">📎 يوجد مرفق</span>' : '';

        return '<div onclick="openTicketThread(' + t.id + ')" style="max-width:480px; margin:0 auto 12px auto; background:linear-gradient(90deg, rgba(255,255,255,0.03) 0%, ' + cardTint + ' 100%); border:1px solid rgba(255,255,255,0.09); padding:14px 16px; border-radius:14px; cursor:pointer; transition:all 0.2s; border-right:4px solid ' + statusColor + '; box-sizing:border-box;" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'rgba(255,255,255,0.09)\'">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap;">' +
                '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
                    '<span style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#ffffff; padding:2px 8px; border-radius:6px; font-size:0.78rem; font-weight:700;">🏷️ ' + themeName + '</span>' +
                    (subthemeName ? '<span style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--text-2); padding:2px 8px; border-radius:6px; font-size:0.76rem;">🔹 ' + subthemeName + '</span>' : '') +

                    'تذكرة رقم ' + t.id +
                '</div>' +
                attachBadge +
            '</div>' +
            (messageSnippet ? '<div style="font-size:0.82rem; color:var(--text-2); margin-bottom:10px; opacity:0.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + messageSnippet + '...</div>' : '') +
            '<div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px;">' +
                '<span style="font-size:0.74rem; color:rgba(255,255,255,0.4);">' + date + '</span>' +
                '<span style="font-size:0.8rem; color:var(--accent); font-weight:bold; display:inline-flex; align-items:center; gap:4px;">عرض المحادثة 💬 ➔</span>' +
            '</div>' +
        '</div>';
    }).join('');
}

let selectedReplyFileBase64 = null;
let selectedReplyFileName = '';

function handleReplyFileSelect(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        selectedReplyFileName = file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedReplyFileBase64 = e.target.result;
            const preview = document.getElementById('modal-reply-attachment-preview');
            const nameEl = document.getElementById('modal-reply-filename');
            if (preview && nameEl) {
                nameEl.innerText = "📎 " + selectedReplyFileName;
                preview.style.display = 'inline-flex';
            }
        };
        reader.readAsDataURL(file);
    }
}

function clearReplyAttachment() {
    selectedReplyFileBase64 = null;
    selectedReplyFileName = '';
    const preview = document.getElementById('modal-reply-attachment-preview');
    const fileInput = document.getElementById('modal-reply-file');
    if (preview) preview.style.display = 'none';
    if (fileInput) fileInput.value = '';
}

function openTicketThread(ticketId) {
    const ticket = studentLoadedTicketsMap[ticketId];
    if (!ticket) return;
    currentThreadTicketId = ticketId;
    clearReplyAttachment();
    
    document.getElementById('modal-thread-title').innerText = '#TK-' + ticket.id + ' - ' + (ticket.subtheme || ticket.theme || 'استفسار');
    const dateStr = ticket.timestamp ? new Date(ticket.timestamp).toLocaleString('ar-MA') : '';
    document.getElementById('modal-thread-subtitle').innerText = 'التاريخ: ' + dateStr;
    
    const statusEl = document.getElementById('modal-thread-status');
    const isResolved = (ticket.status === 'resolved' || ticket.status === 'محلولة');
    const isInProgress = (ticket.status === 'in_progress' || ticket.status === 'قيد المعالجة');
    
    if (isResolved) {
        statusEl.innerText = '🟢 تم الرد (محلولة)';
        statusEl.style.background = 'rgba(46,204,113,0.15)';
        statusEl.style.color = '#2ecc71';
        statusEl.style.border = '1px solid #2ecc71';
    } else if (isInProgress) {
        statusEl.innerText = '🔵 قيد المعالجة';
        statusEl.style.background = 'rgba(52,152,219,0.15)';
        statusEl.style.color = '#3498db';
        statusEl.style.border = '1px solid #3498db';
    } else {
        statusEl.innerText = '🟠 في انتظار الرد';
        statusEl.style.background = 'rgba(243,156,18,0.15)';
        statusEl.style.color = '#f39c12';
        statusEl.style.border = '1px solid #f39c12';
    }
    
    let messages = [];
    if (ticket.conversation) {
        try {
            messages = typeof ticket.conversation === 'string' ? JSON.parse(ticket.conversation) : ticket.conversation;
        } catch(e) { messages = []; }
    }
    
    if (!messages || messages.length === 0) {
        messages = [{ sender: 'student', name: ticket.first_name || 'أنت', text: ticket.message || '', timestamp: dateStr, file_data: ticket.file_data, file_name: ticket.file_name }];
        if (ticket.admin_reply) {
            messages.push({ sender: 'admin', name: ticket.assigned_to || 'فريق الدعم', text: ticket.admin_reply, timestamp: '' });
        }
    }
    
    const container = document.getElementById('modal-thread-messages');
    container.innerHTML = messages.map((m, idx) => {
        const isStudent = (m.sender === 'student' || m.sender === 'user' || !m.sender || m.sender === '');
        const senderTitle = isStudent ? '👤 ' + (m.name || 'أنت') : '🛡️ المشرف (' + (m.name || 'فريق الدعم') + ')';
        const editedTag = m.edited ? '<span style="font-size:0.7rem; color:rgba(255,255,255,0.4); margin-right:4px;">(معدّل)</span>' : '';
        const editBtn = isStudent ? '<button onclick="editStudentMessage(' + idx + ')" style="background:rgba(241,196,15,0.12); border:1px solid rgba(241,196,15,0.3); color:var(--accent); font-size:0.72rem; padding:2px 8px; border-radius:6px; cursor:pointer; font-family:\'Tajawal\'; display:inline-flex; align-items:center; gap:3px;" title="تعديل هذه الرسالة">✏️ تعديل</button>' : '';
        
        let attachmentHtml = '';
        if (m.file_data) {
            if (m.file_data.startsWith('data:image') || m.file_data.includes('.jpg') || m.file_data.includes('.png') || m.file_data.includes('.jpeg')) {
                attachmentHtml = '<img src="' + m.file_data + '" style="max-width:100%; max-height:180px; border-radius:8px; margin-top:8px; display:block; cursor:pointer; border:1px solid rgba(255,255,255,0.15);" onclick="window.open(this.src)" />';
            } else {
                attachmentHtml = '<a href="' + m.file_data + '" target="_blank" style="display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); padding:6px 12px; border-radius:8px; color:var(--accent); font-size:0.8rem; margin-top:6px; text-decoration:none;">📄 ' + (m.file_name || 'تحميل المرفق') + '</a>';
            }
        }

        return '<div style="display:flex; flex-direction:column; align-items:' + (isStudent ? 'flex-start' : 'flex-end') + '; margin-bottom:12px;">' +
            '<div style="font-size:0.75rem; color:var(--text-2); margin-bottom:3px; padding:0 4px; display:flex; align-items:center; gap:4px;">' +
                '<span>' + senderTitle + '</span>' +
                editBtn +
            '</div>' +
            '<div id="msg-bubble-' + idx + '" style="background:' + (isStudent ? '#1e3a8a' : 'rgba(255,255,255,0.08)') + '; border:1px solid ' + (isStudent ? '#3b82f6' : 'rgba(255,255,255,0.15)') + '; padding:12px 16px; border-radius:14px; max-width:85%; font-size:0.9rem; line-height:1.5; color:#fff;">' +
                (m.text || '').split('\n').join('<br>') +
                attachmentHtml +
            '</div>' +
            '<div style="display:flex; align-items:center; font-size:0.7rem; color:rgba(255,255,255,0.35); margin-top:3px; padding:0 4px;">' +
                (m.timestamp || '') + ' ' + editedTag +
            '</div>' +
        '</div>';
    }).join('');
    
    let banner = document.getElementById('thread-resolved-banner');
    const replyBox = document.getElementById('modal-reply-bar');
    
    if (isResolved) {
        if (!banner) {
            banner = document.createElement('div');
            banner.id = 'thread-resolved-banner';
            container.parentNode.insertBefore(banner, replyBox);
        }
        banner.style.display = 'block';
        banner.innerHTML = '<div style="background:rgba(46,204,113,0.08); border:1px solid rgba(46,204,113,0.25); border-radius:12px; padding:14px; margin:15px; text-align:center;"><div style="font-weight:bold; font-size:0.92rem; color:#2ecc71; margin-bottom:4px;">✅ تم حل هذه التذكرة وإغلاقها</div><div style="font-size:0.82rem; color:var(--text-2); margin-bottom:10px;">هل ما زلت بحاجة لمساعدة حول نفس الموضوع؟</div><div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;"><button onclick="reopenCurrentTicket()" style="background:#2ecc71; color:white; border:none; padding:8px 16px; border-radius:20px; font-weight:bold; font-size:0.82rem; cursor:pointer; font-family:\'Tajawal\';">🔄 لا زال لدي استفسار (إعادة فتح)</button><button onclick="openNewTopicFromThread()" style="background:rgba(255,255,255,0.06); color:var(--text-1); border:1px solid rgba(255,255,255,0.15); padding:8px 16px; border-radius:20px; font-size:0.82rem; cursor:pointer; font-family:\'Tajawal\';">➕ موضوع جديد منفصل</button></div></div>';
        if (replyBox) replyBox.style.display = 'none';
    } else {
        if (banner) banner.style.display = 'none';
        if (replyBox) replyBox.style.display = 'flex';
    }
    
    document.getElementById('ticket-thread-modal').style.display = 'flex';
    
    // Drag and Drop support
    container.ondragover = (e) => { e.preventDefault(); container.style.border = '2px dashed var(--accent)'; };
    container.ondragleave = (e) => { e.preventDefault(); container.style.border = 'none'; };
    container.ondrop = (e) => {
        e.preventDefault();
        container.style.border = 'none';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleReplyFileSelect({ files: e.dataTransfer.files });
        }
    };
    
    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
}

async function editStudentMessage(msgIdx) {
    if (!currentThreadTicketId) return;
    const bubble = document.getElementById('msg-bubble-' + msgIdx);
    if (!bubble) return;
    const oldText = bubble.innerText.trim();
    const newText = prompt("تعديل رسالتك:", oldText);
    if (!newText || newText.trim() === oldText) return;
    
    bubble.innerHTML = newText.trim().split('\n').join('<br>') + ' <span style="font-size:0.7rem; color:rgba(255,255,255,0.4);">(معدّل)</span>';
    
    try {
        await fetch(BOT_BASE + '/api/tickets/' + currentThreadTicketId + '/messages/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message_index: msgIdx, text: newText.trim(), role: 'student' })
        });
    } catch(e) {}
}

async function reopenCurrentTicket() {
    if (!currentThreadTicketId) return;
    const statusEl = document.getElementById('modal-thread-status');
    if (statusEl) {
        statusEl.innerText = '🟠 في انتظار الرد';
        statusEl.style.background = 'rgba(243,156,18,0.15)';
        statusEl.style.color = '#f39c12';
        statusEl.style.border = '1px solid #f39c12';
    }
    const banner = document.getElementById('thread-resolved-banner');
    if (banner) banner.style.display = 'none';
    const replyBox = document.getElementById('modal-reply-bar');
    if (replyBox) replyBox.style.display = 'flex';
    
    try {
        await fetch(BOT_BASE + '/api/tickets/' + currentThreadTicketId + '/reopen', { method: 'POST' });
        if (studentLoadedTicketsMap[currentThreadTicketId]) {
            studentLoadedTicketsMap[currentThreadTicketId].status = 'pending';
        }
    } catch(e) {}
}

function openNewTopicFromThread() {
    closeTicketThread();
    switchTab('new');
}

function closeTicketThread() {
    document.getElementById('ticket-thread-modal').style.display = 'none';
    currentThreadTicketId = null;
    clearReplyAttachment();
}

async function sendStudentFollowupReply() {
    const input = document.getElementById('modal-reply-input');
    const msg = (input ? input.value : '').trim();
    if ((!msg && !selectedReplyFileBase64) || !currentThreadTicketId) return;
    
    const fileDataToSend = selectedReplyFileBase64;
    const fileNameToSend = selectedReplyFileName;
    
    input.value = '';
    clearReplyAttachment();
    
    const container = document.getElementById('modal-thread-messages');
    let attachmentHtml = '';
    if (fileDataToSend) {
        if (fileDataToSend.startsWith('data:image')) {
            attachmentHtml = '<img src="' + fileDataToSend + '" style="max-width:100%; max-height:180px; border-radius:8px; margin-top:8px; display:block;" />';
        } else {
            attachmentHtml = '<div style="background:rgba(255,255,255,0.1); padding:6px 12px; border-radius:8px; color:var(--accent); font-size:0.8rem; margin-top:6px;">📄 ' + fileNameToSend + '</div>';
        }
    }

    container.innerHTML += '<div style="display:flex; flex-direction:column; align-items:flex-start; margin-bottom:12px;">' +
        '<div style="font-size:0.75rem; color:var(--text-2); margin-bottom:3px; padding:0 4px;">👤 أنت</div>' +
        '<div style="background:#1e3a8a; border:1px solid #3b82f6; padding:12px 16px; border-radius:14px; max-width:85%; font-size:0.9rem; color:#fff;">' +
            (msg ? msg.split('\n').join('<br>') : '') +
            attachmentHtml +
        '</div>' +
    '</div>';
    container.scrollTop = container.scrollHeight;
    
    const tid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || null;
    const fname = window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name || "الطالب";
    const uname = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || "";
    
    try {
        await fetch(BOT_BASE + '/api/tickets/' + currentThreadTicketId + '/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: msg, 
                telegram_id: tid, 
                first_name: fname, 
                username: uname,
                file_data: fileDataToSend,
                file_name: fileNameToSend
            })
        });
    } catch(e) {}
}

// AI ASSISTANT CHAT
// ========================
async function sendAiMessage() {
    const input = document.getElementById('ai-input');
    const msg = input.value.trim();
    if (!msg) return;
    const container = document.getElementById('ai-messages');
    container.innerHTML += '<div class="message-bubble msg-user">' + msg + '</div>';
    input.value = '';
    
    container.innerHTML += '<div class="message-bubble msg-ai" id="ai-loading">جاري التفكير والكتابة...</div>';
    container.scrollTop = container.scrollHeight;
    
    try {
        const res = await fetch(BOT_BASE + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        document.getElementById('ai-loading').remove();
        if (res.ok) {
            const data = await res.json();
            container.innerHTML += '<div class="message-bubble msg-ai">' + (data.reply || data.response || "عذراً، لم أتمكن من الرد.") + '</div>';
        } else {
            container.innerHTML += '<div class="message-bubble msg-ai" style="color:#e74c3c">حدث خطأ في الاتصال.</div>';
        }
    } catch (e) {
        if (document.getElementById('ai-loading')) document.getElementById('ai-loading').remove();
        container.innerHTML += '<div class="message-bubble msg-ai" style="color:#e74c3c">حدث خطأ. حاول مرة أخرى.</div>';
    }
    container.scrollTop = container.scrollHeight;
}

function sendAiQuickMessage(text) {
    const input = document.getElementById('ai-input');
    if (input) {
        input.value = text;
        sendAiMessage();
    }
}
