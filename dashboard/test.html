<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #22c55e;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        h1 { margin: 0 0 8px 0; font-size: 22px; }
        p { margin: 0 0 20px 0; color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .info-box {
            margin-top: 16px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #cbd5e1;
            text-align: right;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            <div class="pulse-dot"></div>
            <span>الإنترنت والـ WebApp يعملان 100%</span>
        </div>
        <h1>تطبيق الاختبار السريع 🚀</h1>
        <p>إذا كنت ترى هذه الصفحة، فهذا يعني أن Mini App تعمل بشكل ممتاز وأن السيرفر متصل تماماً!</p>
        
        <button class="btn" onclick="handleClick()">اضغط هنا للاختبار (<span id="count">0</span>)</button>

        <div class="info-box">
            <div><strong>الوقت:</strong> <span id="time">--:--:--</span></div>
            <div><strong>مستخدم تليجرام:</strong> <span id="user-info">جاري التحميل...</span></div>
            <div><strong>رابط الصفحة:</strong> <span id="url-info"></span></div>
        </div>
    </div>

    <script>
        let count = 0;
        function handleClick() {
            count++;
            document.getElementById('count').textContent = count;
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('time').textContent = new Date().toLocaleTimeString('fr-FR');
            document.getElementById('url-info').textContent = window.location.href;
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) {
                    document.getElementById('user-info').textContent = (user.first_name || '') + ' ' + (user.last_name || '') + ' (@' + (user.username || 'بدون اسم') + ')';
                } else {
                    document.getElementById('user-info').textContent = 'متصفح عادي (خارج تليجرام)';
                }
            } else {
                document.getElementById('user-info').textContent = 'غير متصل بالتليجرام';
            }
        });
    </script>
</body>
</html>
