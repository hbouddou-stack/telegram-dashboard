<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oswah CRM - مساحة الوكلاء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f3f4f6; /* Light gray background */
      --card-bg: #ffffff; /* White cards */
      --card-border: #e5e7eb;
      --primary: #2563eb; /* Blue primary */
      --primary-hover: #1d4ed8;
      --success: #10b981; /* Green */
      --danger: #ef4444; /* Red */
      --warning: #f59e0b; /* Orange/Yellow */
      --info: #0ea5e9;
      --text-main: #111827;
      --text-muted: #6b7280;
      --radius: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-top: 130px; /* Space for sticky header */
      padding-bottom: 40px;
    }

    /* --- STICKY HEADER --- */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }
    .agent-selector {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
    }

    /* --- PILLS / FILTERS --- */
    .stats-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 18px 12px;
      scrollbar-width: none; /* Firefox */
      background: #ffffff;
    }
    .stats-pills::-webkit-scrollbar { display: none; } /* Chrome */
    
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .pill-badge {
      background: rgba(0,0,0,0.08);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-main);
    }
    
    /* Active Pill States */
    .pill.active {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--primary);
      color: var(--primary);
    }
    .pill.active .pill-badge {
      background: var(--primary);
      color: white;
    }
    
    /* Danger active pill (Overdue) */
    .pill.retard.active {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }
    .pill.retard.active .pill-badge { background: var(--danger); }
    
    /* Warning active pill (Today) */
    .pill.aujourdhui.active {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--warning);
      color: #b45309;
    }
    .pill.aujourdhui.active .pill-badge { background: var(--warning); color: white; }

    /* Paid active pill */
    .pill.paye.active {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--success);
      color: var(--success);
    }
    .pill.paye.active .pill-badge { background: var(--success); color: white; }
    
    .badge-paye { background: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }

    /* --- MAIN CONTAINER --- */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 16px;
    }
    .leads-count-bar {
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* --- LEAD CARD --- */
    .lead-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .lead-card:active {
      transform: scale(0.98);
    }
    .gender-female { border-right: 5px solid #f472b6; background: linear-gradient(to left, rgba(244,114,182,0.03), #fff); }
    .gender-male { border-right: 5px solid #60a5fa; background: linear-gradient(to left, rgba(96,165,250,0.03), #fff); }

    .lead-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .lead-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .lead-id {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Badges */
    .badge-status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-retard { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-aujourdhui { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-nouveau { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-relance { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }

    /* Info Tags */
    .info-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .info-tag {
      background: var(--bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-tag i { color: var(--primary); }

    /* Next Action Box */
    .next-action-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--text-main);
    }
    .next-action-box b { color: var(--primary); }
    
    .last-note-box {
      background: #f1f5f9;
      border-right: 3px solid #cbd5e1;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      margin-top: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
    }
    .last-note-box i { color: var(--text-muted); font-size: 1.1rem; }

    /* Actions Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-action:active { opacity: 0.8; }
    .btn-action i { font-size: 1.1rem; }
    
    .btn-call { background: var(--bg); color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-call:hover { background: #e5e7eb; }
    
    .btn-wa { background: #25D366; color: white; }
    .btn-log { background: var(--primary); color: white; grid-column: span 2; }
    
    /* Footer of Card */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--bg);
      padding-top: 12px;
      margin-top: 12px;
    }
    .last-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      max-width: 60%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-history {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* --- MODAL --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
    .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }

    /* Form Fields */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-success-action {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Timeline (History) */
    .timeline {
      position: relative;
      padding-right: 20px;
      margin-top: 20px;
      border-right: 2px solid var(--card-border);
    }
    .timeline-item { position: relative; margin-bottom: 16px; }
    .timeline-item::before {
      content: '';
      position: absolute;
      right: -26px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid #ffffff;
    }
    .timeline-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .timeline-content-box {
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-main);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
      box-shadow: var(--shadow);
    }
    .toast.show { bottom: 30px; }

    /* Loader */
    .loader { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>

  <!-- STICKY HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="header-title"><i class="fa-solid fa-briefcase"></i> Oswah CRM</div>
      <select id="agentSelect" class="agent-selector" onchange="filterData()">
        <option value="all">👥 جميع الوكلاء</option>
      </select>
    </div>

    <!-- FILTERS -->
    <div class="stats-pills">
      <div class="pill retard" data-filter="retard" onclick="setFilter('retard')">
        <i class="fa-solid fa-clock"></i> متأخر <span class="pill-badge" id="count-retard">0</span>
      </div>
      <div class="pill aujourdhui" data-filter="aujourdhui" onclick="setFilter('aujourdhui')">
        <i class="fa-solid fa-calendar-day"></i> اليوم <span class="pill-badge" id="count-aujourdhui">0</span>
      </div>
      <div class="pill nouveau active" data-filter="nouveau" onclick="setFilter('nouveau')">
        <i class="fa-solid fa-star"></i> جديد <span class="pill-badge" id="count-nouveau">0</span>
      </div>
      <div class="pill relance" data-filter="relance" onclick="setFilter('relance')">
        <i class="fa-solid fa-rotate-right"></i> للمتابعة <span class="pill-badge" id="count-relance">0</span>
      </div>
      <div class="pill paye" data-filter="paye" onclick="setFilter('paye')" style="margin-right: 10px;">
        <i class="fa-solid fa-check-double"></i> تم السداد <span class="pill-badge" id="count-paye">0</span>
      </div>
    </div>
  </header>

  <!-- LEADS CONTAINER -->
  <main class="container">
    <div class="leads-count-bar">
      <span id="current-filter-label">العملاء الجدد</span>
      <span id="leads-count">يتم التحميل...</span>
    </div>
    <div id="leadsList"><div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div></div>
  </main>

  <!-- INTERACTION MODAL -->
  <div class="modal-overlay" id="interactionModal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalLeadName">تسجيل متابعة</div>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Action Form -->
      <div class="form-group">
        <label class="form-label">نتيجة التواصل:</label>
        <select id="modalResultSelect" class="form-control">
          <option value="">-- اختر النتيجة --</option>
          <option value="لا يوجد رد">لا يوجد رد</option>
          <option value="مهتم">مهتم</option>
          <option value="وعد بالسداد">وعد بالسداد</option>
          <option value="غير مهتم">غير مهتم</option>
          <option value="رقم خاطئ">رقم خاطئ</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">تفاصيل المكالمة / الملاحظات:</label>
        <textarea id="modalNoteInput" class="form-control" placeholder="اكتب ملخص ما دار في المكالمة..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">تاريخ المتابعة القادمة:</label>
        <input type="date" id="modalNextDate" class="form-control">
      </div>

      <button class="btn-submit" onclick="submitModalInteraction()">💾 حفظ التحديث</button>
      <button class="btn-success-action" onclick="markPaid()"><i class="fa-solid fa-check-circle"></i> تأكيد الدفع (تم السداد)</button>

      <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 20px 0;">
      
      <div class="modal-title" style="font-size: 1rem; margin-bottom: 10px;">السجل والتاريخ</div>
      <div id="modalTimeline" class="timeline">
        <!-- History injected here -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast">تم التحديث بنجاح!</div>

  <script>
    let allLeads = [];
    let activeFilter = 'nouveau';
    let activeLeadId = null;

    // Persist agent selection
    const savedAgent = localStorage.getItem('crm_agent_ar');
    if (savedAgent) document.getElementById('agentSelect').value = savedAgent;

    async function loadData() {
      try {
        const res = await fetch('/api/crm/data');
        const data = await res.json();
        const today = new Date().toISOString().split('T')[0];

        allLeads = data.leads || [];

        // Categorize leads
        allLeads.forEach(lead => {
          const status = (lead.Statut_CRM || '').toLowerCase();
          const nextDate = lead.Date_Prochaine_Action || '';
          
          if (status === 'مسدد' || status.includes('payé') || status.includes('تم السداد') || status.includes('paye')) {
            lead._category = 'paye';
          } else if (status === 'nouveau' || status === 'جديد' || !status) {
            lead._category = 'nouveau';
          } else if (nextDate) {
            if (nextDate < today) lead._category = 'retard';
            else if (nextDate === today) lead._category = 'aujourdhui';
            else lead._category = 'relance';
          } else {
            lead._category = 'relance';
          }
        });

        // Populate agents
        const uniqueAgents = [...new Set(allLeads.map(l => l.Agent_Nom).filter(Boolean))].sort();
        const select = document.getElementById('agentSelect');
        const currentVal = select.value;
        select.innerHTML = '<option value="all">👥 جميع الوكلاء</option>' + uniqueAgents.map(a => `<option value="${a}">${a}</option>`).join('');
        if (uniqueAgents.includes(currentVal)) select.value = currentVal;
        
        filterData();
      } catch (err) {
        console.error(err);
        document.getElementById('leadsList').innerHTML = '<div class="loader" style="color:var(--danger)">❌ خطأ في الاتصال بالخادم</div>';
      }
    }

    function setFilter(f) {
      activeFilter = f;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      document.querySelector(`.pill[data-filter="${f}"]`).classList.add('active');
      
      const labels = {
        'retard': 'متابعات متأخرة',
        'aujourdhui': 'مهام اليوم',
        'nouveau': 'العملاء الجدد',
        'relance': 'قيد المتابعة',
        'paye': 'تم السداد'
      };
      document.getElementById('current-filter-label').textContent = labels[f] || '';
      filterData();
    }

    function filterData() {
      const agent = document.getElementById('agentSelect').value;
      localStorage.setItem('crm_agent_ar', agent);

      let filtered = allLeads;
      if (agent !== 'all') {
        filtered = filtered.filter(l => l.Agent_Nom === agent);
      }

      // Update counters
      const stats = { retard: 0, aujourdhui: 0, nouveau: 0, relance: 0, paye: 0 };
      filtered.forEach(l => { if (stats[l._category] !== undefined) stats[l._category]++; });

      document.getElementById('count-retard').textContent = stats.retard;
      document.getElementById('count-aujourdhui').textContent = stats.aujourdhui;
      document.getElementById('count-nouveau').textContent = stats.nouveau;
      document.getElementById('count-relance').textContent = stats.relance;
      document.getElementById('count-paye').textContent = stats.paye;

      // Filter by category
      const displayed = filtered.filter(l => l._category === activeFilter);
      
      // Sort: closest dates first
      displayed.sort((a, b) => {
        if (!a.Date_Prochaine_Action) return 1;
        if (!b.Date_Prochaine_Action) return -1;
        return a.Date_Prochaine_Action.localeCompare(b.Date_Prochaine_Action);
      });

      renderLeads(displayed);
    }

    function renderLeads(leads) {
      document.getElementById('leads-count').textContent = `العدد: ${leads.length}`;
      const container = document.getElementById('leadsList');
      
      if (leads.length === 0) {
        container.innerHTML = '<div class="loader">لا يوجد عملاء في هذه القائمة 🎉</div>';
        return;
      }

      container.innerHTML = leads.map(l => {
        // Clean phone for tel: link (remove spaces, etc)
        let cleanPhone = String(l.Telephone || '').replace(/\D/g, '');
        if (cleanPhone.startsWith('0')) cleanPhone = '212' + cleanPhone.substring(1);
        else if (!cleanPhone.startsWith('212') && cleanPhone.length === 9) cleanPhone = '212' + cleanPhone;
        
        let waLink = `https://wa.me/${cleanPhone}`;

        const genderClass = l.Genre === 'female' || l.Genre === 'أنثى' ? 'gender-female' : 'gender-male';

        let statusBadge = '';
        if (l._category === 'retard') statusBadge = '<span class="badge-status badge-retard">⏰ متأخر</span>';
        else if (l._category === 'aujourdhui') statusBadge = '<span class="badge-status badge-aujourdhui">📅 اليوم</span>';
        else if (l._category === 'nouveau') statusBadge = '<span class="badge-status badge-nouveau">⭐ جديد</span>';
        else if (l._category === 'paye') statusBadge = '<span class="badge-status badge-paye">✅ مسدد</span>';
        else statusBadge = '<span class="badge-status badge-relance">🔄 قيد المتابعة</span>';
        
        const lastNote = l.Ancien_Commentaire ? `<div class="last-note-box"><i class="fa-solid fa-quote-right"></i><div>${escapeHtml(l.Ancien_Commentaire)}</div></div>` : '';

        return `
          <div class="lead-card ${genderClass}">
            <div class="lead-header">
              <div>
                <div class="lead-name">${escapeHtml(l.Nom || 'بدون اسم')}</div>
                <div class="lead-id">رقم الطالب: <b>#${l.ID_Lead}</b></div>
              </div>
              <div>${statusBadge}</div>
            </div>

            <div class="info-tags" style="margin-bottom: 8px;">
              <span class="info-tag" style="font-size:0.95rem; font-weight:700;"><i class="fa-solid fa-phone"></i> <span dir="ltr">${escapeHtml(l.Telephone || '-')}</span></span>
            </div>
            
            ${lastNote}

            <div class="next-action-box" style="display: ${l._category==='paye' ? 'none' : 'block'};">
              <b>الخطوة القادمة:</b> ${escapeHtml(l.Prochaine_Action || 'غير محدد')}
              ${l.Date_Prochaine_Action ? `<span style="color:var(--text-muted); font-size:0.8rem; margin-right:5px;">(${l.Date_Prochaine_Action})</span>` : ''}
              ${l.Dernier_Contact_Resultat ? `<div style="margin-top:4px; font-size:0.8rem;"><i class="fa-solid fa-reply"></i> النتيجة السابقة: ${escapeHtml(l.Dernier_Contact_Resultat)}</div>` : ''}
            </div>

            <div class="actions-grid">
              <a href="tel:+${cleanPhone}" class="btn-action btn-call" onclick="logCallAttempt('${l.ID_Lead}')">
                <i class="fa-solid fa-phone"></i> اتصال
              </a>
              <a href="${waLink}" target="_blank" class="btn-action btn-wa" onclick="logWhatsApp('${l.ID_Lead}')">
                <i class="fa-brands fa-whatsapp"></i> واتساب
              </a>
              <button class="btn-action btn-log" onclick="openInteractionModal('${l.ID_Lead}')">
                <i class="fa-solid fa-pen-to-square"></i> تسجيل متابعة / السجل
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateLeadAPI(leadId, payload) {
      try {
        const lead = allLeads.find(l => String(l.ID_Lead) === String(leadId));
        if (lead) {
          lead.Statut_CRM = payload.statut;
          lead.Dernier_Contact_Resultat = payload.resultat;
          lead.Prochaine_Action = payload.prochaine_action;
          lead.Date_Prochaine_Action = payload.date_prochaine;
        }

        filterData();

        await fetch('/api/crm/update-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lead_id: leadId,
            ...payload,
            agent_email: lead ? lead.Agent_Email : ''
          })
        });
      } catch (err) {
        console.error('Update error:', err);
      }
    }

    async function logWhatsApp(leadId) {
      const today = new Date().toISOString().split('T')[0];
      await updateLeadAPI(leadId, {
        statut: 'للمتابعة',
        resultat: 'واتساب مرسل',
        prochaine_action: 'انتظار رد',
        date_prochaine: today,
        note: 'تم إرسال رسالة واتساب'
      });
      showToast('تم تسجيل إرسال الواتساب');
    }
    
    async function logCallAttempt(leadId) {
      // Visual only
    }

    async function markPaid() {
      if (!activeLeadId) return;
      if (!confirm("هل أنت متأكد من تأكيد دفع واشتراك هذا العميل؟")) return;

      await updateLeadAPI(activeLeadId, {
        statut: 'مسدد',
        resultat: 'تم تأكيد الدفع',
        prochaine_action: 'مغلق',
        date_prochaine: '',
        note: 'تم تأكيد الدفع والاشتراك بنجاح'
      });
      
      closeModal();
      showToast('تم تحويل العميل إلى مسدد! 🎉');
    }

    async function submitModalInteraction() {
      const resultat = document.getElementById('modalResultSelect').value;
      const note = document.getElementById('modalNoteInput').value.trim();
      const nextDate = document.getElementById('modalNextDate').value;

      if (!resultat && !note) {
        alert("يرجى اختيار النتيجة أو كتابة ملاحظة");
        return;
      }
      
      if (!nextDate && resultat !== 'غير مهتم' && resultat !== 'رقم خاطئ') {
        alert("يرجى تحديد تاريخ المتابعة القادمة");
        return;
      }

      let status = 'للمتابعة';
      let nextAction = 'معاودة الاتصال';
      
      if (resultat === 'غير مهتم' || resultat === 'رقم خاطئ') {
        status = 'مغلق';
        nextAction = 'لا شيء';
      } else if (resultat === 'لا يوجد رد') {
        nextAction = 'معاودة الاتصال';
      }

      await updateLeadAPI(activeLeadId, {
        statut: status,
        resultat: resultat || 'للمتابعة',
        prochaine_action: nextAction,
        date_prochaine: nextDate,
        note: note || resultat
      });

      closeModal();
      showToast('تم حفظ التحديث بنجاح!');
    }

    async function openInteractionModal(leadId) {
      activeLeadId = leadId;
      const modal = document.getElementById('interactionModal');
      modal.classList.add('active');

      const lead = allLeads.find(l => String(l.ID_Lead) === String(leadId));
      if (lead) {
        document.getElementById('modalLeadName').textContent = `تسجيل متابعة: ${lead.Nom || ''}`;
      }
      
      document.getElementById('modalResultSelect').value = '';
      document.getElementById('modalNoteInput').value = '';
      
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('modalNextDate').value = tomorrow.toISOString().split('T')[0];

      const timeline = document.getElementById('modalTimeline');
      timeline.innerHTML = '<div class="loader" style="padding:10px;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل السجل...</div>';

      try {
        const res = await fetch(`/api/crm/lead-details?lead_id=${leadId}`);
        const data = await res.json();
        const interactions = data.interactions || [];

        if (interactions.length === 0) {
          timeline.innerHTML = '<div class="timeline-content-box" style="text-align:center;">لا توجد تفاعلات سابقة</div>';
        } else {
          timeline.innerHTML = interactions.map(i => `
            <div class="timeline-item">
              <div class="timeline-date"><b style="color:var(--text-main)">${escapeHtml(i.Date_Heure || '')}</b> • ${escapeHtml(i.Resultat || '')}</div>
              <div class="timeline-content-box">${escapeHtml(i.Commentaire || '')}</div>
            </div>
          `).join('');
        }
      } catch (e) {
        timeline.innerHTML = '<div class="timeline-content-box" style="color:var(--danger);">خطأ في تحميل السجل</div>';
      }
    }

    function closeModal() {
      document.getElementById('interactionModal').classList.remove('active');
      activeLeadId = null;
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'interactionModal') closeModal();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Init
    loadData();
  </script>
</body>
</html>
