<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support - Zendesk Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="bot-config.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="support.css">
</head>
<body>
    <div id="config-overlay" class="config-overlay" style="display: none;">
        <div class="config-modal">
            <h2>تسجيل دخول المشرفين</h2>
            <input type="number" id="manual-user-id" class="form-input" placeholder="ID" value="2045194295">
            <button class="btn" onclick="submitManualUserId()">دخول</button>
        </div>
    </div>

    <div id="app-wrapper">
        <section id="view-inbox" class="view active">
            <header class="app-header">
                <h1>💬 التذاكر</h1>
                <button class="btn-icon" onclick="loadTickets()">🔄</button>
            </header>
            
            <div id="tickets-feed" class="feed-container">
                <div style="text-align:center; padding:50px; color:#666;">جاري التحميل...</div>
            </div>

            <nav class="bottom-nav">
                <div class="nav-item active" onclick="filterTickets('Nouveau', this)">
                    <span class="nav-icon">🔴</span><span class="nav-label">جديد</span>
                </div>
                <div class="nav-item" onclick="filterTickets('En cours', this)">
                    <span class="nav-icon">🟡</span><span class="nav-label">قيد المعالجة</span>
                </div>
                <div class="nav-item" onclick="filterTickets('Résolu', this)">
                    <span class="nav-icon">🟢</span><span class="nav-label">مكتمل</span>
                </div>
            </nav>
        </section>

        <section id="view-chat" class="view">
            <header class="app-header">
                <button class="btn-icon" onclick="goBack()">🔙 عودة</button>
                <h1 id="chat-title" style="font-size: 1rem;">طالب</h1>
                <button id="btn-resolve" class="btn btn-sm btn-success" onclick="resolveCurrentTicket()">✔ حل</button>
            </header>

            <div id="chat-feed" class="chat-container"></div>

            <footer class="chat-input-area">
                <button class="btn-ai" onclick="generateAIResponse()">✨</button>
                <textarea id="chat-reply-input" placeholder="اكتب ردك هنا..."></textarea>
                <button class="btn-send" onclick="sendReply()">✈️</button>
            </footer>
        </section>
    </div>
    <script src="support.js"></script>
</body>
</html>
