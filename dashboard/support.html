<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز المساعدة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #1e0033 0%, #000b29 100%);
            --surface: rgba(255, 255, 255, 0.05);
            --primary: #ffffff;
            --text-1: #ffffff;
            --text-2: #b3a5c7;
            --danger: #ff453a;
            --accent: #8736ff;
        }
        html, body {
            background-color: #000b29;
            background-image: var(--bg);
            color: var(--text-1);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }
        p.subtitle {
            margin: 5px 0 0 0;
            color: var(--text-2);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .form-card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-2);
        }
        select, textarea {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-1);
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        select:focus, textarea:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,0.5);
        }
        textarea {
            resize: none;
            min-height: 120px;
        }
        
        button.btn-primary {
            background: linear-gradient(90deg, var(--accent) 0%, #5721d9 100%);
            color: var(--text-1);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(135, 54, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
            width: 100%;
        }
        button.btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(135, 54, 255, 0.2);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-screen .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="support-form">
        <div class="header">
            <div class="header-icon">💬</div>
            <h1>مركز المساعدة</h1>
            <p class="subtitle">نحن هنا لمساعدتك. يرجى اختيار نوع المشكلة ووصفها بدقة.</p>
        </div>
        
        <div class="form-card">
            <div class="input-group">
                <label>نوع المشكلة (Thématique)</label>
                <select id="theme" onchange="updateSubTheme()">
                    <option value="">-- اختر نوع المشكلة --</option>
                    <option value="التقنية">مشكلة تقنية (تطبيق، منصة...)</option>
                    <option value="التسجيل">مشكلة في التسجيل</option>
                    <option value="الدفع">مشكلة في الدفع</option>
                    <option value="الدروس">استفسار عن الدروس</option>
                    <option value="الامتحانات">استفسار عن الامتحانات</option>
                </select>
            </div>
            
            <div class="input-group" id="subtheme-group" style="display: none;">
                <label>التفاصيل (Sous-thématique)</label>
                <select id="subtheme">
                    <!-- Populated by JS -->
                </select>
            </div>
            
            <div class="input-group">
                <label>وصف المشكلة</label>
                <textarea id="message" placeholder="اكتب تفاصيل مشكلتك هنا بوضوح لنتمكن من مساعدتك بأسرع وقت..."></textarea>
            </div>
            
            <button class="btn-primary" id="btn-submit" onclick="submitTicket()">إرسال الطلب</button>
        </div>
    </div>
    
    <div class="container success-screen" id="success-screen">
        <div class="icon">✅</div>
        <h2 style="color:var(--accent);">تم إرسال طلبك بنجاح</h2>
        <p style="color:var(--text-2); line-height: 1.6;">لقد استلمنا رسالتك وسيقوم فريق الدعم بالرد عليك في أقرب وقت ممكن عبر رسالة خاصة في تيليجرام.</p>
        <button class="btn-primary" style="margin-top:20px;" onclick="window.Telegram.WebApp.close()">إغلاق</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        setTimeout(() => { window.scrollTo(0, 0); }, 100);

        const subthemes = {
            "التقنية": ["لا أستطيع تسجيل الدخول", "الفيديو لا يعمل", "المنصة بطيئة", "مشكلة أخرى"],
            "التسجيل": ["لم أستلم بريد التأكيد", "بياناتي خاطئة", "مشكلة أخرى"],
            "الدفع": ["فشل عملية الدفع", "استفسار عن الفاتورة", "مشكلة أخرى"],
            "الدروس": ["أين أجد الدرس؟", "الدرس غير مفهوم", "مشكلة في تحميل الملفات", "مشكلة أخرى"],
            "الامتحانات": ["متى موعد الامتحان؟", "مشكلة أثناء اجتياز الامتحان", "استفسار عن النتيجة", "مشكلة أخرى"]
        };

        function updateSubTheme() {
            const theme = document.getElementById('theme').value;
            const subGroup = document.getElementById('subtheme-group');
            const subSelect = document.getElementById('subtheme');
            
            if (theme && subthemes[theme]) {
                subSelect.innerHTML = '<option value="">-- اختر التفاصيل --</option>';
                subthemes[theme].forEach(sub => {
                    subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
                subGroup.style.display = 'flex';
            } else {
                subGroup.style.display = 'none';
                subSelect.innerHTML = '';
            }
        }

        async function submitTicket() {
            const theme = document.getElementById('theme').value;
            const subtheme = document.getElementById('subtheme').value;
            const msg = document.getElementById('message').value.trim();
            
            if (!theme || (subthemes[theme] && !subtheme) || !msg) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
                    window.Telegram.WebApp.showAlert("يرجى ملء جميع الحقول.");
                } else {
                    alert("يرجى ملء جميع الحقول.");
                }
                return;
            }
            
            const btn = document.getElementById('btn-submit');
            btn.textContent = "جاري الإرسال...";
            btn.disabled = true;
            
            let tid = null;
            let username = "غير معروف";
            let first_name = "غير معروف";
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                tid = window.Telegram.WebApp.initDataUnsafe.user.id;
                username = window.Telegram.WebApp.initDataUnsafe.user.username || "";
                first_name = window.Telegram.WebApp.initDataUnsafe.user.first_name || "";
            }
            
            try {
                const response = await fetch('/api/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        theme: theme, 
                        subtheme: subtheme, 
                        message: msg, 
                        telegram_id: tid,
                        username: username,
                        first_name: first_name
                    })
                });
                
                document.getElementById('support-form').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            } catch (e) {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
                    window.Telegram.WebApp.showAlert("❌ حدث خطأ. يرجى المحاولة لاحقاً.");
                } else {
                    alert("❌ حدث خطأ. يرجى المحاولة لاحقاً.");
                }
                btn.textContent = "إرسال الطلب";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
