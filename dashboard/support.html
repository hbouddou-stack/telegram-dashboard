<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Support CRM - Académie El Baji</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="bot-config.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="support.css">
</head>
<body>
    <div id="config-overlay" class="config-overlay" style="display: none;">
        <div class="config-modal">
            <h2>تسجيل دخول المشرفين</h2>
            <input type="number" id="manual-user-id" class="form-input" placeholder="ID" value="2045194295">
            <button class="btn" onclick="submitManualUserId()">دخول</button>
        </div>
    </div>

    <div id="crm-layout">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>CRM الدعم</h2>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-item active" data-route="inbox">
                    <span class="sidebar-icon">📩</span>
                    <span class="sidebar-label">التذاكر</span>
                </div>
                <div class="sidebar-item" data-route="students">
                    <span class="sidebar-icon">👥</span>
                    <span class="sidebar-label">الطلاب</span>
                </div>
                <div class="sidebar-item" data-route="stats">
                    <span class="sidebar-icon">📊</span>
                    <span class="sidebar-label">الإحصائيات</span>
                </div>
                <div class="sidebar-item" data-route="faq">
                    <span class="sidebar-icon">🧠</span>
                    <span class="sidebar-label">مدير FAQ</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-item" data-route="settings">
                    <span class="sidebar-icon">⚙️</span>
                    <span class="sidebar-label">الإعدادات</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Router Area -->
        <main id="main-content">
            <!-- Vues injectées ici par JS -->
        </main>
        
        <!-- Chat Detail View (Overlay) -->
        <section id="view-chat" class="view overlay-view">
            <header class="app-header">
                <button class="btn-icon back-btn" onclick="goBack()">🔙</button>
                <div class="chat-header-info">
                    <div class="chat-avatar" id="chat-header-avatar">ط</div>
                    <h1 id="chat-title" style="font-size: 1rem; margin-right: 10px;">طالب</h1>
                </div>
                <button id="btn-reassign" class="btn btn-sm" onclick="reassignTicket()">🔄 تحويل</button>
                <button id="btn-resolve" class="btn btn-sm btn-success" onclick="resolveCurrentTicket()">✔ حل</button>
            </header>
            
            <div class="chat-context-bar" id="chat-context">
                <span class="context-badge">عام</span>
                <span class="context-date">--</span>
            </div>

            <div id="chat-feed" class="chat-container">
            </div>

            <footer class="chat-input-area">
                <button class="btn-ai" onclick="generateAIResponse()" title="اقتراح إجابة ذكية">✨</button>
                <button class="btn-attach" onclick="triggerAttach()" title="إرفاق صورة">🖼️</button>
                <textarea id="chat-reply-input" placeholder="اكتب ردك هنا..."></textarea>
                <button class="btn-send" onclick="sendReply()">✈️</button>
            </footer>
        </section>

    </div>

    <!-- Modular JS App Entry Point -->
    <script type="module" src="js/app.js"></script>
    <script>
        // Global variables still needed for external scripts occasionally
        window.adminId = null;
        function submitManualUserId() {
            window.adminId = document.getElementById('manual-user-id').value;
            if (!window.adminId) return;
            document.getElementById('config-overlay').style.display = 'none';
            // trigger event for app.js
            window.dispatchEvent(new Event('admin-logged-in'));
        }
    </script>
</body>
</html>
