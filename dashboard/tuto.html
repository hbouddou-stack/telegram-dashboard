<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توجيهات الربط</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        #insta-tuto-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .progress-container {
            display: flex;
            gap: 4px;
            padding: 15px 10px 0;
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            z-index: 10;
        }
        .story-progress {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        .story-progress-bar {
            height: 100%;
            background: #fff;
            width: 0%;
        }
        
        .close-btn {
            position: absolute;
            top: 30px; right: 15px;
            background: none; border: none;
            color: #fff; font-size: 2rem;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        #story-content-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .story-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }
        
        /* Tap Zones */
        .tap-left {
            position: absolute;
            top: 0; left: 0;
            width: 30%; height: 100%;
            z-index: 5;
        }
        .tap-right {
            position: absolute;
            top: 0; right: 0;
            width: 70%; height: 100%;
            z-index: 5;
        }
        
        .story-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            z-index: 11;
        }
    </style>
</head>
<body>

<div id="insta-tuto-container">
    <!-- Progress Bars -->
    <div class="progress-container">
        <div class="story-progress"><div class="story-progress-bar" id="story-bar-0"></div></div>
        <div class="story-progress"><div class="story-progress-bar" id="story-bar-1"></div></div>
        <div class="story-progress"><div class="story-progress-bar" id="story-bar-2"></div></div>
    </div>
    
    <!-- Close -->
    <button class="close-btn" onclick="finishTuto()">&times;</button>
    
    <!-- Stories -->
    <div id="story-content-container">
        
        <!-- Story 0 -->
        <div class="story-slide" id="story-slide-0" style="background: linear-gradient(135deg, #FF2A5F, #FF7B00);">
            <div style="font-size:5rem; margin-bottom:20px;">👋</div>
            <h2 style="color:#fff; font-size:2.5rem; margin-bottom:10px; font-weight:900;">مرحباً بك!</h2>
            <p style="color:rgba(255,255,255,0.9); font-size:1.2rem;">لربط حسابك في الأكاديمية، ستحتاج إلى رقم الطالب الخاص بك.</p>
        </div>
        
        <!-- Story 1 -->
        <div class="story-slide" id="story-slide-1" style="background: linear-gradient(135deg, #0a84ff, #0054a8);">
            <div style="font-size:4rem; margin-bottom:20px;">🔍</div>
            <h2 style="color:#fff; font-size:2.2rem; margin-bottom:10px; font-weight:800;">أين أجده؟</h2>
            <p style="color:rgba(255,255,255,0.9); font-size:1.1rem; margin-bottom:20px;">تجد رقم الطالب في مساحة التعلم الخاصة بك.</p>
            <img src="/tuto.jpg" alt="طريقة إيجاد رقم الطالب" onerror="this.style.display='none'" style="max-width:90%; max-height:40vh; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,0.5); object-fit:contain;">
        </div>
        
        <!-- Story 2 -->
        <div class="story-slide" id="story-slide-2" style="background: linear-gradient(135deg, #32d74b, #219630);">
            <div style="font-size:5rem; margin-bottom:20px;">✅</div>
            <h2 style="color:#fff; font-size:2.5rem; margin-bottom:10px; font-weight:900;">جاهز للربط؟</h2>
            <p style="color:rgba(255,255,255,0.9); font-size:1.2rem;">أدخل رقمك الدراسي وتاريخ ميلادك في الصفحة السابقة لإكمال العملية.</p>
            <button class="story-btn" onclick="finishTuto()">العودة للربط الآن</button>
        </div>
        
    </div>
    
    <!-- Tap Zones -->
    <div class="tap-left" onclick="prevStory()"></div>
    <div class="tap-right" onclick="nextStory()"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    let currentStory = 0;
    const totalStories = 3;
    let storyTimer;
    let storyStartTime;
    let storyProgressInterval;
    const STORY_DURATION = 5000;
    
    window.onload = () => {
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }
        updateStories();
    };

    function updateStories() {
        for(let i=0; i<totalStories; i++) {
            document.getElementById('story-slide-' + i).style.display = (i === currentStory) ? 'flex' : 'none';
        }
        for(let i=0; i<totalStories; i++) {
            const bar = document.getElementById('story-bar-' + i);
            if (i < currentStory) {
                bar.style.width = '100%';
            } else if (i > currentStory) {
                bar.style.width = '0%';
            } else {
                bar.style.width = '0%';
            }
        }
        startStoryTimer();
    }

    function startStoryTimer() {
        clearInterval(storyProgressInterval);
        clearTimeout(storyTimer);
        
        const bar = document.getElementById('story-bar-' + currentStory);
        let startTime = Date.now();
        
        storyProgressInterval = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let pct = (elapsed / STORY_DURATION) * 100;
            if (pct > 100) pct = 100;
            bar.style.width = pct + '%';
        }, 16);
        
        storyTimer = setTimeout(() => {
            nextStory();
        }, STORY_DURATION);
    }

    function nextStory() {
        if (currentStory < totalStories - 1) {
            currentStory++;
            updateStories();
        } else {
            finishTuto();
        }
    }

    function prevStory() {
        if (currentStory > 0) {
            currentStory--;
            updateStories();
        } else {
            updateStories();
        }
    }

    function finishTuto() {
        clearInterval(storyProgressInterval);
        clearTimeout(storyTimer);
        window.location.href = '/link.html';
    }
</script>
</body>
</html>
