<!-- MODAL DOUBLONS -->
<div id="modal-duplicates" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:2147483647; background:rgba(0,0,0,0.88); align-items:flex-end; justify-content:center;">
    <div style="background:var(--surface); width:100%; max-width:700px; max-height:88vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column; overflow:hidden;">
        <!-- STICKY HEADER -->
        <div style="flex-shrink:0; padding:16px 20px 12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--surface); position:sticky; top:0; z-index:10;">
            <div>
                <h3 style="margin:0; font-size:1.2rem; color:var(--text1); font-weight:900;" dir="rtl">🔍 مُدقِّق التكرارات</h3>
                <p style="margin:4px 0 0 0; font-size:0.78rem; color:var(--text2);" id="dup-scan-info" dir="rtl">يتم الفحص على الطلاب المعروضين حاليًا فقط</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-shrink:0;">
                <!-- View toggle -->
                <button id="dup-view-cards" onclick="setDupView('cards')" style="background:var(--accent); color:white; border:none; border-radius:8px; padding:5px 10px; font-size:0.75rem; cursor:pointer;">🃏 بطاقات</button>
                <button id="dup-view-table" onclick="setDupView('table')" style="background:var(--bg); border:1px solid var(--border); color:var(--text2); border-radius:8px; padding:5px 10px; font-size:0.75rem; cursor:pointer;">📋 جدول</button>
                <button onclick="closeDuplicateScanner()" style="background:#ef4444; border:none; color:white; padding:6px 14px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:0.9rem;">✕ إغلاق</button>
            </div>
        </div>
        <!-- SCROLLABLE BODY -->
        <div id="duplicates-container" style="flex:1; overflow-y:scroll; padding:16px; display:flex; flex-direction:column; gap:16px;">
            <!-- Content injected via JS -->
        </div>
        <!-- STICKY FOOTER: excluded list -->
        <div id="dup-excluded-section" style="flex-shrink:0; border-top:1px solid var(--border); padding:12px 20px; background:var(--bg); display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;" dir="rtl">
                <span style="font-size:0.85rem; font-weight:bold; color:var(--text2);">👻 الحسابات المُستبعَدة</span>
                <span id="dup-excluded-count" style="font-size:0.75rem; color:var(--text2);">0 حساب</span>
            </div>
            <div id="dup-excluded-list" style="display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:scroll;"></div>
        </div>
    </div>
</div>
